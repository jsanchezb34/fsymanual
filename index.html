o siguiendo los principios que enseñó durante el análisis sobre la reverencia y el testimonio. Asegúrese de terminar a tiempo."]},{"id":"s147","nivel":1,"titulo":"Anuncios y oración","fuente":{"pagina_impresa_inicio":75,"pagina_impresa_fin":75,"pagina_pdf_inicio":79,"pagina_pdf_fin":79},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Recuerde a los jóvenes el horario y los procedimientos para el registro de salida por la mañana."]},{"id":"s148","nivel":1,"titulo":"Apagar las luces","fuente":{"pagina_impresa_inicio":76,"pagina_impresa_fin":76,"pagina_pdf_inicio":80,"pagina_pdf_fin":80},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Haga todo lo que pueda para ayudar a los jóvenes a terminar la semana de una manera positiva. La hora en la que se apagan las luces se debe cumplir estrictamente el día 5."]},{"id":"s149","nivel":1,"titulo":"Guardia nocturna","fuente":{"pagina_impresa_inicio":76,"pagina_impresa_fin":76,"pagina_pdf_inicio":80,"pagina_pdf_fin":80},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Durante las guardias nocturnas, el personal asignado de FSY se encargará de que se apaguen las luces para asegurarse de que todos los jóvenes permanezcan en sus dormitorios. El personal debe comprender la importancia de mantener un entorno seguro y protegido. Siga las instrucciones, sea flexible y esté dispuesto a ayudar."]},{"id":"s150","nivel":1,"titulo":"Revisión de las habitaciones al final de la sesión/ Salida de los participantes","fuente":{"pagina_impresa_inicio":77,"pagina_impresa_fin":77,"pagina_pdf_inicio":81,"pagina_pdf_fin":81},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Se espera que todo el personal esté de guardia durante la salida de los participantes y la reunión final. Asegúrese de que se sigan los procedimientos del registro de salida y que los jóvenes se reúnan de manera segura con sus padres, tutores legales o líderes de su unidad.","• Lleve a cabo la salida de cada participante según las instrucciones de su coordinador o coordinador auxiliar.","◦ Inspeccione cada zona y habitación con los jóvenes.","◦ Recoja todas las llaves de los jóvenes como se indica (si corresponde).","◦ Asegúrese de que todas las llaves perdidas (si corresponde) y cualquier daño causado por los participantes estén documentados (si corresponde).","◦ Asegúrese de que los jóvenes y todas sus pertenencias estén fuera de la habitación después de la inspección. Revise los armarios, cajones, el espacio debajo de la cama, los tomacorrientes, etc. Cierre con llave la puerta al salir. Los jóvenes no deben permanecer en sus habitaciones ni regresar a ellas una vez que hayan salido.","◦ Devuelva las llaves y envíe los informes de daños como se indica (si corresponde).","• Si un joven tiene que marcharse temprano, se espera que los consejeros estén con él para completar los procedimientos de revisión de la habitación y de salida. De acuerdo con las normas, usted (acompañado por otro consejero) debe permanecer con el participante para garantizar su seguridad hasta que sea recogido por su padre/madre, su tutor legal, un servicio de transporte o esté en su propio vehículo."]},{"id":"s151","nivel":1,"titulo":"Reunión final/Devolución de llaves","fuente":{"pagina_impresa_inicio":78,"pagina_impresa_fin":78,"pagina_pdf_inicio":82,"pagina_pdf_fin":82},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Esta reunión es obligatoria para todos los consejeros.","Los coordinadores dirigirán, harán los anuncios necesarios y guiarán un análisis para repasar la conferencia."]},{"id":"s152","nivel":2,"titulo":"Durante esta reunión","fuente":{"pagina_impresa_inicio":78,"pagina_impresa_fin":78,"pagina_pdf_inicio":82,"pagina_pdf_fin":82},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Asegúrese de que se hayan entregado las llaves y se hayan enviado los informes de daños (si corresponde).","• Coordine las necesidades logísticas para marcharse de la sesión."]}],"ambiguedades":[{"id":"A-1","ref":"R-1","tema":"Remisión «pág. 38» del baile"},{"id":"A-2","ref":"R-2","tema":"Remisión «pág. 80» reverencia/testimonio"},{"id":"A-3","ref":"R-4","tema":"Remisión a juegos en págs. 90–93 (sección de coordinadores auxiliares)"},{"id":"A-12","ref":"R-5","tema":"Remisión a pautas de variedades en pág. 104 (sección de coordinadores auxiliares)"},{"id":"A-4","tema":"Día 0: dos actividades sin hora ('por determinarse en la sesión')","actividades":["d0-01","d0-02"]},{"id":"A-5","tema":"Filas con formato de hora irregular o fuera de orden (confirmado en las imágenes: el orden y el formato son los del manual)","actividades":["d2-16","d3-14","d3-15"]},{"id":"A-7","tema":"Error tipográfico del manual: 'verpertino' (confirmado en la imagen de la página impresa 54)","actividades":["d4-20"]},{"id":"A-9","tema":"Separadores ' | ' y ' - ' dentro de una misma fila de agenda: el manual no aclara si es una actividad compuesta o varias consecutivas; se conservan ambos separadores tal cual.","actividades":["d1-05","d1-14","d1-18","d2-09","d2-10","d2-15","d2-18","d2-22","d3-08","d3-09","d3-13","d3-17","d3-20","d3-22","d4-05","d4-08","d4-09","d4-10","d4-17","d4-21","d4-23","d5-09","d5-14","d5-19","d6-02"]},{"id":"A-10","tema":"Filas sin instrucciones propias en la sección del consejero (solo agenda)","actividades":["d0-05","d1-01","d1-02","d1-12","d1-21","d2-05","d2-12","d2-25","d3-11","d3-25","d4-13","d4-20","d4-21","d4-26","d5-21","d6-01"]},{"id":"A-13","tema":"Actividad Vivir el Evangelio: la tabla interna del manual (p.70) indica 11:15–12:30 h, pero la agenda del Día 5 la sitúa en 13:45–15:00 h (la franja 11:15–12:30 es la de la actividad de la guía PLFJ). Misma duración total (75 min). No se corrige.","actividades":["d5-10","d5-07"]},{"id":"A-14","tema":"Competencia de versos cantados: si la noche de juegos se retrasa, el manual alienta a posponerla al Día 5, pero la agenda del Día 5 no tiene franja para ella. Posible adaptación local.","actividades":["d3-19"]},{"id":"A-15","tema":"Repaso del est "se entera de que un joven está siendo sometido a condiciones o circunstancias que razonablemente darían lugar a abusos","debe comunicar la situación a un coordinador, a las autoridades locales o a ambos"],"estado":"borrador_pendiente_revision_humana","escenario":"Un participante te cuenta que otro joven vive en circunstancias que razonablemente podrían dar lugar a abusos.","aviso":"Escenario ficticio creado para practicar; no es una instrucción oficial del manual.","seccion_titulo":"Explicaciones de la lista de verificación","pagina_impresa":26,"pagina_pdf":30},{"id":"S06","tipo":"simulacion","actividades":["d1-18","d2-22","d3-22","d4-23"],"seccion_id":"s031","enunciado":"¿Qué harías tú?","opciones":[{"id":"o1","texto":"Solo con tu permiso y acompañado por un miembro del personal y al menos otra persona.","correcta":true},{"id":"o2","texto":"Permitirlo si promete volver pronto.","correcta":false},{"id":"o3","texto":"Permitirlo si avisa a un compañero.","correcta":false}],"explicacion":"El manual indica que no pueden salir de su piso o dormitorio, excepto con permiso del consejero y acompañados por un miembro del personal y al menos otra persona.","evidencia":["A los participantes no se les permite salir de su piso o dormitorio, excepto con el permiso de su consejero y acompañados por un miembro del personal y al menos otra persona."],"estado":"borrador_pendiente_revision_humana","escenario":"Después del recuento nocturno, un joven te dice que necesita salir de su piso.","aviso":"Escenario ficticio creado para practicar; no es una instrucción oficial del manual.","seccion_titulo":"Explicaciones de la lista de verificación","pagina_impresa":26,"pagina_pdf":30}];

<script>
/* FSY 2027 — Manual interactivo para consejeros (prototipo: Días 0 y 1)
   Sin dependencias. Los datos vienen de data.js (generado desde fsy_consejeros_data.json). */
(function () {
  'use strict';
  var D = window.FSY_DATA;
  var main = document.getElementById('main');
  var live = document.getElementById('live');
  var DOC = 'Manual para el personal FSY 2027';

  /* ---------- utilidades ---------- */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
  function say(msg) { live.textContent = ''; setTimeout(function () { live.textContent = msg; }, 30); }
  var store = {
    get: function (k, def) { try { var v = localStorage.getItem('fsy27c:' + k); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
    set: function (k, v) { try { localStorage.setItem('fsy27c:' + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  };
  var studied = store.get('studied', {});   // id -> fecha ISO
  var favs = store.get('fav', []);          // [id]
  var seen = store.get('seen', {});         // id -> fecha ISO de última consulta
  var quizState = store.get('quiz', {});   // id -> {ok:boolean, tries:n}
  var Q = window.FSY_QUIZ || [];
  var storageOk = store.set('probe', 1);

  /* ---------- datos ---------- */
  var actById = {}, secById = {}, dayByNum = {}, simult = {};
  D.actividades.forEach(function (a) { actById[a.id] = a; });
  D.secciones.forEach(function (s) { secById[s.id] = s; });
  D.dias.forEach(function (d) {
    dayByNum[d.numero] = d;
    d.solapes_calculados.forEach(function (p) {
      (simult[p[0]] = simult[p[0]] || []).push(p[1]);
      (simult[p[1]] = simult[p[1]] || []).push(p[0]);
    });
  });
  var avail = D.meta.dias_disponibles;
  function dayActs(n) { return D.actividades.filter(function (a) { return a.dia === n; }); }
  function fechaLarga(n) {
    var iso = D.configuracion.fechas_por_dia[String(n)];
    try { return new Date(iso + 'T12:00:00').toLocaleDateString('es-BO', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
    catch (e) { return iso; }
  }
  function dressOf(n) { return dayByNum[n] ? dayByNum[n].vestimenta_manual : ''; }

  /* índice de búsqueda */
  var index = D.actividades.map(function (a) {
    var texts = [a.nombre_original];
    a.instrucciones.forEach(function (i) { var s = secById[i.seccion_id]; texts.push(s.titulo); texts = texts.concat(s.parrafos); });
    return { a: a, t: norm(texts.join(' ')), paras: texts };
  });

  /* ---------- piezas de HTML ---------- */
  function dayStyle(n) { return 'style="--day:var(--d' + n + ')"'; }

  function dayBar(current) {
    var html = '<ul class="days" aria-label="Seleccionar día">';
    for (var n = 0; n <= 6; n++) {
      var on = avail.indexOf(n) >= 0;
      html += '<li>' + (on
        ? '<a class="day-btn" ' + dayStyle(n) + ' href="#/dia/' + n + '"' + (n === current ? ' aria-current="page"' : '') + '><small>Día</small><b>' + n + '</b></a>'
        : '<button type="button" class="day-btn" ' + dayStyle(n) + ' aria-disabled="true" data-soon="' + n + '"><small>Día</small><b>' + n + '</b></button>') + '</li>';
    }
    return html + '</ul>' + (avail.length < 7 ? '<p class="hint" id="soon-hint">Los días con borde punteado aún no están disponibles en esta versión.</p>' : '');
  }

  function timeHtml(a) {
    if (!a.inicio) return '<div class="time"><em>Hora por determinar</em></div>';
    return '<div class="time"><b>' + a.inicio + '</b>' + (a.fin ? '<span>' + a.fin + '</span>' : '') + '</div>';
  }

  function chipsHtml(a) {
    var c = '';
    var p = a.participacion_consejero;
    if (p) c += '<span class="chip role">Consejero: ' + esc(p.valores.join(' / ')) + '</span>';
    if (simult[a.id]) c += '<span class="chip">Coincide en horario con otra actividad</span>';
    if (a.notas_mapeo && a.notas_mapeo.some(function (n) { return /dudoso/i.test(n); })) c += '<span class="chip warn">Revisión pendiente</span>';
    if (studied[a.id]) c += '<span class="chip done">✓ Estudiada</span>';
    if (favs.indexOf(a.id) >= 0) c += '<span class="chip">★ Favorita</span>';
    return c;
  }

  function sectionHtml(s) {
    var html = s.nivel >= 2 ? '<h5>' + esc(s.titulo) + '</h5>' : '<h4>' + esc(s.titulo) + '</h4>';
    var items = null;
    function flush() {
      if (!items) return;
      html += '<ul>' + items.map(function (it) {
        return '<li>' + esc(it.t) + (it.sub.length ? '<ul>' + it.sub.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') + '</li>';
      }).join('') + '</ul>';
      items = null;
    }
    s.parrafos.forEach(function (p) {
      if (p.indexOf('•') === 0) { items = items || []; items.push({ t: p.replace(/^•\s*/, ''), sub: [] }); }
      else if (p.indexOf('◦') === 0 && items && items.length) { items[items.length - 1].sub.push(p.replace(/^◦\s*/, '')); }
      else { flush(); html += '<p>' + esc(p) + '</p>'; }
    });
    flush();
    return html;
  }

  function pagesLabel(secs) {
    if (!secs.length) return '';
    var lo = 999, hi = 0;
    secs.forEach(function (s) { lo = Math.min(lo, s.fuente.pagina_impresa_inicio); hi = Math.max(hi, s.fuente.pagina_impresa_fin); });
    return lo === hi ? 'p. ' + lo : 'págs. ' + lo + '–' + hi;
  }

  function actionsHtml(a) {
    var st = !!studied[a.id], fv = favs.indexOf(a.id) >= 0;
    return '<div class="actions">' +
      '<button type="button" class="btn ok" data-studied="' + a.id + '" aria-pressed="' + st + '">' + (st ? '✓ Estudiada' : 'Marcar como estudiada') + '</button>' +
      '<button type="button" class="btn" data-fav="' + a.id + '" aria-pressed="' + fv + '">' + (fv ? '★ En favoritos' : '☆ Guardar favorito') + '</button>' +
      '<a class="btn" href="#/estudio/' + a.id + '" style="display:inline-flex;align-items:center;text-decoration:none">Modo estudio</a>' + practiceLinks(a.id) + '</div>';
  }

  function practiceLinks(id) {
    var nq = Q.filter(function (q) { return q.tipo === 'pregunta' && q.actividades.indexOf(id) >= 0; }).length;
    var ns = Q.filter(function (q) { return q.tipo === 'simulacion' && q.actividades.indexOf(id) >= 0; }).length;
    var st = 'style="display:inline-flex;align-items:center;text-decoration:none"';
    return (nq ? '<a class="btn" ' + st + ' href="#/practica/' + id + '">Preguntas (' + nq + ')</a>' : '') + (ns ? '<a class="btn" ' + st + ' href="#/simulaciones/' + id + '">¿Qué harías tú? (' + ns + ')</a>' : '');
  }
  function bodyHtml(a) {
    var own = [], assign = [], shared = [];
    a.instrucciones.forEach(function (i) {
      var s = secById[i.seccion_id];
      (i.alcance === 'propia_del_dia' ? own : i.alcance === 'responsabilidad_por_asignacion' ? assign : shared).push(s);
    });
    var html = '<ul class="facts">';
    html += '<li><b>Hora en el manual:</b> ' + esc(a.hora_original) + '</li>';
    if (a.participacion_consejero) {
      html += '<li><b>Papel del consejero:</b> ' + esc(a.participacion_consejero.valores.join(' / ')) +
        ' <span class="src">(Agenda recomendada para el personal, impresas 5–11' +
        (a.participacion_consejero.vinculo !== 'misma_hora_inicio' ? '; la fila de esa agenda abarca una franja más amplia' : '') + ')</span></li>';
    }
    if (simult[a.id]) {
      html += '<li><b>Coincide en horario con:</b> ' + simult[a.id].map(function (id) {
        return '<a href="#/dia/' + actById[id].dia + '/' + id + '">' + esc(actById[id].nombre_original) + ' (' + esc(actById[id].hora_original) + ')</a>';
      }).join('; ') + ' <span class="src">(calculado a partir de las horas del manual)</span></li>';
    }
    (a.notas_mapeo || []).forEach(function (n) { html += '<li class="pend"><b>Revisión pendiente:</b> ' + esc(n) + '</li>'; });
    if (seen[a.id]) html += '<li class="src">Última consulta: ' + new Date(seen[a.id]).toLocaleDateString('es-BO') + '</li>';
    html += '</ul>';

    if (own.length) {
      html += '<div class="manual"><p class="manual-label">Texto del manual (extraído automáticamente; pendiente de verificación visual)</p>' + own.map(sectionHtml).join('') + '</div>';
    }
    if (assign.length) {
      html += '<details class="more"><summary>Responsabilidades por asignación (' + pagesLabel(assign) + ')</summary><div class="manual"><p class="manual-label">Texto del manual. Aplica solo si se le asigna esta responsabilidad.</p>' + assign.map(sectionHtml).join('') + '</div></details>';
    }
    if (shared.length) {
      html += '<details class="more"><summary>Instrucciones explicadas en otro día o apartado (' + pagesLabel(shared) + ')</summary><div class="manual"><p class="manual-label">El manual no repite estas instrucciones cada día. Texto del manual; el enlace con esta actividad es por coincidencia de nombre.</p>' + shared.map(sectionHtml).join('') + '</div></details>';
    }
    if (!a.instrucciones.length) {
      html += '<p class="src">En la sección del consejero esta actividad solo aparece en la agenda; no hay instrucciones propias. No se agregan instrucciones que el manual no trae.</p>';
    }
    html += '<p class="src">Fuente: ' + DOC + ', agenda del consejero (Día ' + a.dia + '), página impresa ' + a.fuente_agenda.pagina_impresa + ' (PDF ' + a.fuente_agenda.pagina_pdf + ').' +
      (a.instrucciones.length ? ' Instrucciones: ' + pagesLabel(own.concat(assign, shared)) + ' (página impresa).' : '') + '</p>';
    return html + '<div data-actions>' + actionsHtml(a) + '</div>';
  }

  function cardHtml(a) {
    return '<li class="act" id="a-' + a.id + '" ' + dayStyle(a.dia) + '>' + timeHtml(a) +
      '<article class="card"><h3 class="act-h"><button type="button" class="act-toggle" aria-expanded="false" aria-controls="p-' + a.id + '" data-toggle="' + a.id + '">' +
      '<span class="act-name">' + esc(a.nombre_original) + '</span><span class="chips" data-chips>' + chipsHtml(a) + '</span>' +
      '<span class="cta"><span data-cta>Ver instrucciones</span> <i aria-hidden="true">▼</i></span></button></h3>' +
      '<div class="panel" id="p-' + a.id + '" hidden></div></article></li>';
  }

  /* ---------- vistas ---------- */
  function progressOf(n) {
    var list = n === undefined ? D.actividades : dayActs(n);
    var done = list.filter(function (a) { return studied[a.id]; }).length;
    return { done: done, total: list.length, pct: list.length ? Math.round(100 * done / list.length) : 0 };
  }
  function barHtml(p, label) {
    return '<div class="progress"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + p.pct + '" aria-label="' + esc(label) + '"><i style="width:' + p.pct + '%"></i></div>' +
      '<p>' + p.done + ' de ' + p.total + ' actividades estudiadas (' + p.pct + '%)</p></div>';
  }

  function viewHome() {
    return '<section class="hero"><p class="kicker">FSY 2027</p><h1>Regocijaos en Cristo</h1><p class="lema">«Regocijaos en el Señor siempre»</p><p class="ref">Filipenses 4:4</p><p class="sub">Manual interactivo para consejeros</p></section>' +
      '<p class="welcome">Prepárate para servir, fortalecer la fe de los jóvenes y ayudarles a acercarse a Jesucristo.<small>Mensaje editorial de esta guía; no es texto del manual.</small></p>' +
      '<div class="notice"><strong>Versión de prueba: ' + (avail.length === 7 ? 'Días 0 a 6' : 'Días ' + avail.join(', ')) + '</strong>Los horarios de la agenda del consejero se compararon con las páginas del manual. Los textos de instrucciones están extraídos del manual y aún no se revisaron visualmente; algunas referencias están marcadas como «Revisión pendiente». Para decisiones de su sesión, consulte a su coordinador.</div>' +
      '<h2 style="margin:.2rem 0 .6rem;font-size:1.2rem">Elige un día</h2>' + dayBar(-1) +
      '<div class="tools"><a class="btn primary" style="text-decoration:none;display:inline-flex;align-items:center" href="#/buscar">Buscar en el manual</a><a class="btn" style="text-decoration:none;display:inline-flex;align-items:center" href="#/progreso">Mi avance</a></div>';
  }

  function viewDay(n, focusId) {
    var d = dayByNum[n]; var acts = dayActs(n);
    var first = acts.filter(function (a) { return a.inicio; })[0];
    var p = progressOf(n);
    var html = dayBar(n) +
      '<header class="day-head" ' + dayStyle(n) + '><h1>Día ' + n + '</h1><p class="date">' + esc(fechaLarga(n)) + '</p><span class="dress">Vestimenta (manual): ' + esc(dressOf(n)) + '</span>' +
      '<p class="summary">' + acts.length + ' filas en la agenda del consejero' + (first ? ', desde las ' + first.inicio : '') + '. Resumen automático; las fechas de la sesión no vienen del manual.</p>' + barHtml(p, 'Avance del Día ' + n) + '</header>' +
      '<div class="tools"><button type="button" class="btn" data-expand="1">Expandir todas</button><button type="button" class="btn" data-expand="0">Contraer todas</button></div>' +
      '<ol class="timeline" ' + dayStyle(n) + '>' + acts.map(cardHtml).join('') + '</ol>';
    return html;
  }

  function viewStudy(id) {
    var a = actById[id]; if (!a) return viewHome();
    var list = dayActs(a.dia), i = list.indexOf(a);
    seen[id] = new Date().toISOString(); store.set('seen', seen);
    return '<p><a href="#/dia/' + a.dia + '/' + id + '">← Volver al cronograma del Día ' + a.dia + '</a></p>' +
      '<article class="study" ' + dayStyle(a.dia) + '><p class="time-big">Día ' + a.dia + ' · ' + esc(a.hora_original) + ' · Actividad ' + (i + 1) + ' de ' + list.length + '</p><h1>' + esc(a.nombre_original) + '</h1>' + bodyHtml(a) + '</article>' +
      '<div class="study-nav">' + (i > 0 ? '<a class="btn" style="text-decoration:none;text-align:center" href="#/estudio/' + list[i - 1].id + '">← Anterior</a>' : '<span></span>') +
      (i < list.length - 1 ? '<a class="btn primary" style="text-decoration:none;text-align:center" href="#/estudio/' + list[i + 1].id + '">Siguiente →</a>' : '<span></span>') + '</div>';
  }

  function resultLink(r) {
    var a = r.a;
    return '<a href="#/dia/' + a.dia + '/' + a.id + '" ' + dayStyle(a.dia) + '><strong>' + esc(a.nombre_original) + '</strong><small>Día ' + a.dia + ' · ' + esc(a.hora_original) + '</small>' + (r.snip ? '<p>' + esc(r.snip) + '</p>' : '') + '</a>';
  }
  function resultItem(r) { return '<li>' + resultLink(r) + '</li>'; }
  function search(q) {
    var toks = norm(q).split(/\s+/).filter(function (t) { return t.length > 1; });
    if (!toks.length) return [];
    var out = [];
    index.forEach(function (it) {
      if (toks.every(function (t) { return it.t.indexOf(t) >= 0; })) {
        var inName = toks.every(function (t) { return norm(it.a.nombre_original).indexOf(t) >= 0; });
        var snip = '';
        if (!inName) {
          var hit = it.paras.filter(function (p) { return toks.every(function (t) { return norm(p).indexOf(t) >= 0; }); })[0] || it.paras.filter(function (p) { return norm(p).indexOf(toks[0]) >= 0; })[0] || '';
          snip = hit.length > 150 ? hit.slice(0, 150) + '…' : hit;
        }
        out.push({ a: it.a, snip: snip, score: inName ? 0 : 1 });
      }
    });
    out.sort(function (x, y) { return x.score - y.score || x.a.dia - y.a.dia || x.a.orden - y.a.orden; });
    return out.slice(0, 40);
  }
  var lastQuery = '';
  function viewSearch() {
    return '<h1 style="font-size:1.5rem">Buscar en el manual</h1><p class="hint">Busca en los nombres y en el texto de las instrucciones de los días disponibles (' + avail.map(function (n) { return 'Día ' + n; }).join(', ') + ').</p>' +
      '<div class="search" role="search"><label class="sr" for="q">Palabras clave</label><input id="q" type="search" placeholder="Ej.: recuento, llegada, seguridad" value="' + esc(lastQuery) + '" autocomplete="off"></div><div id="res" aria-live="polite"></div>';
  }
  function drawResults() {
    var box = document.getElementById('res'); if (!box) return;
    var q = lastQuery.trim();
    if (!q) { box.innerHTML = '<p class="empty">Escribe una o más palabras para encontrar actividades e instrucciones.</p>'; return; }
    var r = search(q);
    box.innerHTML = r.length ? '<p class="hint">' + r.length + ' resultado' + (r.length === 1 ? '' : 's') + '</p><ul class="results">' + r.map(resultItem).join('') + '</ul>'
      : '<p class="empty">No hay resultados para «' + esc(q) + '» en los Días ' + avail.join(' y ') + '. Prueba con otra palabra; los demás días se agregarán después.</p>';
  }

  function viewFavs() {
    var list = favs.map(function (id) { return actById[id]; }).filter(Boolean);
    return '<h1 style="font-size:1.5rem">Mis favoritos</h1>' + (list.length
      ? '<ul class="results">' + list.map(function (a) {
        return '<li style="display:grid;gap:.3rem">' + resultLink({ a: a, snip: '' }) + '<button type="button" class="btn" data-fav="' + a.id + '" data-refresh="1">Quitar de favoritos</button></li>';
      }).join('') + '</ul>'
      : '<p class="empty">Aún no guardas favoritos. Abre una actividad y toca «Guardar favorito».</p>');
  }

  function viewProgress() {
    var all = progressOf();
    return '<h1 style="font-size:1.5rem">Mi avance</h1>' + barHtml(all, 'Avance general') +
      '<table class="table-days"><caption class="sr">Avance por día</caption><thead><tr><th scope="col">Día</th><th scope="col">Estudiadas</th><th scope="col">Avance</th></tr></thead><tbody>' +
      avail.map(function (n) { var p = progressOf(n); return '<tr><th scope="row"><a href="#/dia/' + n + '">Día ' + n + '</a></th><td>' + p.done + ' de ' + p.total + '</td><td>' + p.pct + '%</td></tr>'; }).join('') + '</tbody></table>' +
      '<p class="score">Preguntas respondidas correctamente: <b>' + quizScore('pregunta').ok + ' de ' + quizScore('pregunta').total + '</b> · Escenarios: <b>' + quizScore('simulacion').ok + ' de ' + quizScore('simulacion').total + '</b></p><p class="hint">El avance se calcula sobre las actividades disponibles hoy en esta guía (' + all.total + '). Es un registro personal guardado en este dispositivo: marcar una actividad como estudiada no certifica que se comprenda ni constituye una certificación oficial.' + (storageOk ? '' : ' <strong>Este navegador no permite guardar datos; el avance se perderá al cerrar.</strong>') + '</p>' +
      '<div class="tools"><button type="button" class="btn" data-reset="1">Reiniciar mi avance</button></div>';
  }

  /* ---------- práctica: preguntas y simulaciones ---------- */
  function seeded(id) { var h = 2166136261; for (var i = 0; i < id.length; i++) { h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); } return function () { h = (h + 0x6D2B79F5) | 0; var t = Math.imul(h ^ (h >>> 15), 1 | h); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffled(q) { var r = seeded(q.id), a = q.opciones.slice(); for (var i = a.length - 1; i > 0; i--) { var k = Math.floor(r() * (i + 1)), t = a[i]; a[i] = a[k]; a[k] = t; } return a; }
  function quizScore(tipo) { var items = Q.filter(function (q) { return q.tipo === tipo; }); var ok = items.filter(function (q) { return quizState[q.id] && quizState[q.id].ok; }).length; return { ok: ok, total: items.length }; }
  function questionHtml(q, n) {
    var letters = 'ABCD';
    var opts = shuffled(q).map(function (o, i) {
      return '<label class="opt"><input type="radio" name="r-' + q.id + '" value="' + o.id + '"><span><b>' + letters[i] + '.</b> ' + esc(o.texto) + '</span></label>';
    }).join('');
    return '<li class="q" id="q-' + q.id + '"><fieldset><legend><span class="qtag">' + (q.tipo === 'simulacion' ? 'Escenario ' : 'Pregunta ') + n + '</span>' + (q.escenario ? '' : esc(q.enunciado)) + '</legend>' +
      (q.escenario ? '<p class="scenario">' + esc(q.escenario) + '</p><p><b>' + esc(q.enunciado) + '</b></p><p class="src">' + esc(q.aviso || '') + '</p>' : '') +
      '<div class="opts">' + opts + '</div><div class="q-actions"><button type="button" class="btn primary" data-check="' + q.id + '">Comprobar</button></div><div class="q-result" data-result="' + q.id + '" aria-live="polite"></div></fieldset></li>';
  }
  function viewPractice(tipo, filterId) {
    var items = Q.filter(function (q) { return q.tipo === tipo && (!filterId || q.actividades.indexOf(filterId) >= 0); });
    var sc = quizScore(tipo), sim = tipo === 'simulacion';
    var title = sim ? '¿Qué harías tú?' : 'Preguntas de repaso';
    var html = '<h1 style="font-size:1.5rem">' + title + '</h1>' +
      '<div class="subnav"><a class="btn' + (sim ? '' : ' primary') + '" style="text-decoration:none" href="#/practica">Preguntas</a><a class="btn' + (sim ? ' primary' : '') + '" style="text-decoration:none" href="#/simulaciones">¿Qué harías tú?</a></div>' +
      '<p class="hint">' + (sim ? 'Situaciones ficticias para practicar. Las respuestas se basan en el texto del manual; los escenarios no son instrucciones oficiales.' : 'Preguntas opcionales basadas únicamente en el texto del manual. Tu resultado es personal y no se compara con nadie.') + '</p>' +
      '<p class="score">Respondidas correctamente: <b data-score>' + sc.ok + ' de ' + sc.total + '</b> (registro personal en este dispositivo).</p>';
    if (filterId && actById[filterId]) html += '<p>Mostrando solo: <a href="#/dia/' + actById[filterId].dia + '/' + filterId + '">' + esc(actById[filterId].nombre_original) + '</a> · <a href="#/' + (sim ? 'simulaciones' : 'practica') + '">ver todas</a></p>';
    html += items.length ? '<ol class="qlist">' + items.map(function (q, i) { return questionHtml(q, i + 1); }).join('') + '</ol>'
      : '<p class="empty">Todavía no hay ' + (sim ? 'escenarios' : 'preguntas') + ' para esta actividad. Solo se agregan cuando el manual respalda cada respuesta.</p>';
    return html + '<p class="hint">Hoy hay ' + Q.filter(function (q) { return q.tipo === 'pregunta'; }).length + ' preguntas y ' + Q.filter(function (q) { return q.tipo === 'simulacion'; }).length + ' escenarios; se ampliarán con más actividades.</p>';
  }
  function checkAnswer(id) {
    var q = Q.filter(function (x) { return x.id === id; })[0], box = document.querySelector('[data-result="' + id + '"]'), card = document.getElementById('q-' + id);
    var chosen = card.querySelector('input:checked');
    if (!chosen) { box.innerHTML = '<p class="verdict">Elige una opción primero.</p>'; return; }
    var ok = q.opciones.filter(function (o) { return o.id === chosen.value; })[0].correcta;
    var right = q.opciones.filter(function (o) { return o.correcta; })[0];
    var st = quizState[id] || { ok: false, tries: 0 }; st.tries++; st.ok = st.ok || ok; quizState[id] = st; store.set('quiz', quizState);
    card.querySelectorAll('.opt').forEach(function (l) {
      var inp = l.querySelector('input'); inp.disabled = true;
      if (inp.value === right.id) { l.classList.add('is-right'); l.querySelector('b').textContent = '✓ ' + l.querySelector('b').textContent; }
      else if (inp.checked) { l.classList.add('is-wrong'); l.querySelector('b').textContent = '✗ ' + l.querySelector('b').textContent; }
    });
    var a0 = actById[q.actividades[0]];
    box.innerHTML = '<p class="verdict">' + (ok ? '✓ Correcto.' : '✗ No es la opción correcta. La respuesta correcta es: ' + esc(right.texto)) + '</p><p>' + esc(q.explicacion) + '</p>' +
      '<div class="manual"><p class="manual-label">Lo que dice el manual</p>' + q.evidencia.map(function (e) { return '<p>«' + esc(e) + '»</p>'; }).join('') + '</div>' +
      '<p class="src">Fuente: ' + DOC + ', p. ' + q.pagina_impresa + ' (PDF ' + q.pagina_pdf + '), «' + esc(q.seccion_titulo) + '». ' + (a0 ? '<a href="#/dia/' + a0.dia + '/' + a0.id + '">Ver la actividad</a>' : '') + '</p>' +
      '<div class="q-actions"><button type="button" class="btn" data-retry="' + id + '">Volver a intentar</button></div>';
    var s = document.querySelector('[data-score]'); if (s) { var sc = quizScore(q.tipo); s.textContent = sc.ok + ' de ' + sc.total; }
    say(ok ? 'Respuesta correcta' : 'Respuesta incorrecta');
  }
  function retry(id) {
    var q = Q.filter(function (x) { return x.id === id; })[0], card = document.getElementById('q-' + id);
    var li = document.createElement('div'); li.innerHTML = questionHtml(q, card.querySelector('.qtag').textContent.replace(/\D+/g, ''));
    card.replaceWith(li.firstChild);
  }

  /* ---------- tarjetas: abrir/cerrar ---------- */
  function setOpen(id, open) {
    var btn = document.querySelector('[data-toggle="' + id + '"]'); if (!btn) return;
    var panel = document.getElementById('p-' + id);
    if (open && !panel.innerHTML) panel.innerHTML = bodyHtml(actById[id]);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.querySelector('[data-cta]').textContent = open ? 'Ocultar instrucciones' : 'Ver instrucciones';
    panel.hidden = !open;
    if (open) { seen[id] = new Date().toISOString(); store.set('seen', seen); }
  }
  function refreshCard(id) {
    var card = document.getElementById('a-' + id);
    if (card) {
      card.querySelector('[data-chips]').innerHTML = chipsHtml(actById[id]);
      var holder = card.querySelector('[data-actions]'); if (holder) holder.innerHTML = actionsHtml(actById[id]);
    }
    var s = document.querySelector('.study [data-actions]');
    if (s && document.querySelector('.study')) s.innerHTML = actionsHtml(actById[id]);
    var pr = document.querySelector('.day-head .progress');
    var cur = /#\/dia\/(\d)/.exec(location.hash);
    if (pr && cur) pr.outerHTML = barHtml(progressOf(+cur[1]), 'Avance del Día ' + cur[1]);
  }

  /* ---------- eventos ---------- */
  main.addEventListener('click', function (e) {
    var t = e.target.closest('[data-toggle],[data-expand],[data-studied],[data-fav],[data-soon],[data-reset],[data-check],[data-retry]');
    if (!t) return;
    if (t.dataset.toggle) { setOpen(t.dataset.toggle, t.getAttribute('aria-expanded') !== 'true'); }
    else if (t.dataset.check) { checkAnswer(t.dataset.check); }
    else if (t.dataset.retry) { retry(t.dataset.retry); }
    else if (t.dataset.expand !== undefined) {
      var open = t.dataset.expand === '1';
      document.querySelectorAll('[data-toggle]').forEach(function (b) { setOpen(b.dataset.toggle, open); });
      say(open ? 'Todas las actividades expandidas' : 'Todas las actividades contraídas');
    } else if (t.dataset.studied) {
      var id = t.dataset.studied;
      if (studied[id]) delete studied[id]; else studied[id] = new Date().toISOString();
      store.set('studied', studied); refreshCard(id); say(studied[id] ? 'Marcada como estudiada' : 'Desmarcada');
    } else if (t.dataset.fav) {
      var f = t.dataset.fav, k = favs.indexOf(f);
      if (k >= 0) favs.splice(k, 1); else favs.push(f);
      store.set('fav', favs); say(k >= 0 ? 'Quitada de favoritos' : 'Guardada en favoritos');
      if (t.dataset.refresh) render(); else refreshCard(f);
    } else if (t.dataset.soon !== undefined) {
      say('El Día ' + t.dataset.soon + ' aún no está disponible en esta versión.');
      var h = document.getElementById('soon-hint'); if (h) { h.setAttribute('tabindex', '-1'); h.focus(); }
    } else if (t.dataset.reset) {
      if (window.confirm('¿Borrar tu avance de estudio y tus resultados de práctica en este dispositivo?')) { studied = {}; store.set('studied', studied); quizState = {}; store.set('quiz', quizState); say('Avance reiniciado'); render(); }
    }
  });
  main.addEventListener('input', function (e) { if (e.target.id === 'q') { lastQuery = e.target.value; drawResults(); } });

  /* ---------- enrutador ---------- */
  function render() {
    var h = location.hash.replace(/^#/, '') || '/';
    var m, html, nav = 'home', focusId = null;
    if ((m = /^\/dia\/(\d)(?:\/([\w-]+))?$/.exec(h)) && avail.indexOf(+m[1]) >= 0) { html = viewDay(+m[1], m[2]); focusId = m[2]; nav = 'dia'; document.title = 'Día ' + m[1] + ' — FSY 2027 consejeros'; store.set('lastday', +m[1]); }
    else if ((m = /^\/estudio\/([\w-]+)$/.exec(h)) && actById[m[1]]) { html = viewStudy(m[1]); nav = 'dia'; document.title = 'Modo estudio — FSY 2027'; }
    else if ((m = /^\/practica(?:\/([\w-]+))?$/.exec(h))) { html = viewPractice('pregunta', m[1]); nav = 'practica'; document.title = 'Preguntas de repaso — FSY 2027'; }
    else if ((m = /^\/simulaciones(?:\/([\w-]+))?$/.exec(h))) { html = viewPractice('simulacion', m[1]); nav = 'practica'; document.title = '¿Qué harías tú? — FSY 2027'; }
    else if (h === '/buscar') { html = viewSearch(); nav = 'buscar'; document.title = 'Buscar — FSY 2027'; }
    else if (h === '/favoritos') { html = viewFavs(); nav = 'favoritos'; document.title = 'Favoritos — FSY 2027'; }
    else if (h === '/progreso') { html = viewProgress(); nav = 'progreso'; document.title = 'Mi avance — FSY 2027'; }
    else { html = viewHome(); document.title = 'FSY 2027 — Manual interactivo para consejeros'; }
    main.innerHTML = html;
    document.querySelectorAll('.bottom a').forEach(function (a) {
      if (a.dataset.nav === nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    if (h === '/buscar') drawResults();
    if (focusId && actById[focusId]) {
      setOpen(focusId, true);
      var el = document.getElementById('a-' + focusId);
      if (el) { el.scrollIntoView({ block: 'start' }); var b = el.querySelector('[data-toggle]'); if (b) b.focus({ preventScroll: true }); }
    } else { window.scrollTo(0, 0); main.focus({ preventScroll: true }); }
  }
  window.addEventListener('hashchange', render);
  render();
})();

</script>
