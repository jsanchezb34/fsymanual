asa, trate de dirigir los comentarios de los participantes para que conviertan en acciones lo que han sentido, de forma que estén preparados para esta actividad final. Este es un momento para meditar sobre cómo pueden tener experiencias que los ayuden a llegar a ser más semejantes a Jesucristo al hacer y guardar convenios sagrados y prepararse para alcanzar la gloria celestial. La parte “Llévatelo a casa” de Reflexiona y repasa debe centrarse en los cambios duraderos que los jóvenes tienen la intención de mantener mucho después de haber regresado de la sesión de FSY.","Anuncios y oración (5 minutos) Antes de orar juntos, haga los anuncios o recordatorios necesarios de último momento. Orar juntos fomenta la unidad y la fortaleza. Después, anime a los jóvenes a regresar a sus habitaciones y ofrecer oraciones personales antes de acostarse. Sugerencias de anuncios","• Los jóvenes a los que se les ha asignado el devocional para participantes del Día 2 deben prepararse.","• Deben estar completamente listos para el día antes de dirigirse al devocional para participantes.","• Comiencen a pensar en ideas para un estandarte y un verso cantado de la compañía."]},{"id":"s055","nivel":1,"titulo":"Apagar las luces","fuente":{"pagina_impresa_inicio":40,"pagina_impresa_fin":40,"pagina_pdf_inicio":44,"pagina_pdf_fin":44},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Las luces se apagan a las 22:30 h. Enseñe a los jóvenes que necesitan dormir bien para sentir plenamente el Espíritu y tener una buena experiencia durante la conferencia. Si alguno de los jóvenes no coopera, los consejeros y los coordinadores auxiliares deben enseñarle principios y permitirle que actúe por sí mismo. Sea sensible y tenga tacto. Los compañeros de cuarto pueden hablar después de que se apagan las luces, si lo hacen en voz baja y no molestan a los demás.","Informe a su coordinador auxiliar cuando todas las luces estén apagadas. Mantenga la vigilancia cerca de los dormitorios de los jóvenes durante quince minutos después de que la luz del último participante se haya apagado, a menos que se indique lo contrario. Los coordinadores y los coordinadores auxiliares pueden extender la duración de la vigilancia nocturna si es necesario."]},{"id":"s056","nivel":1,"titulo":"Reunión de coordinadores auxiliares/consejeros","fuente":{"pagina_impresa_inicio":42,"pagina_impresa_fin":42,"pagina_pdf_inicio":46,"pagina_pdf_fin":46},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Acuda vestido y listo para salir, ya que no tendrá tiempo de terminar de arreglarse más tarde. Comiencen el día orando juntos. Escuche atentamente los anuncios y las instrucciones."]},{"id":"s057","nivel":1,"titulo":"Devocional matutino para participantes","fuente":{"pagina_impresa_inicio":42,"pagina_impresa_fin":42,"pagina_pdf_inicio":46,"pagina_pdf_fin":46},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Durante el devocional, los participantes tendrán la oportunidad de enseñar y aprender de los miembros de su grupo. Las asignaciones para todos los devocionales para participantes se deben haber hecho durante Reúnete con tu consejero.","Después del devocional, haga los anuncios, según sea necesario. Brevemente, repase las actividades del día y asegúrese de que los participantes sepan dónde deben estar y cuándo.","Sugerencias de anuncios","• Diga a los jóvenes dónde deben reunirse después del almuerzo para el recuento de personas.","• Invite a los jóvenes a buscar y anotar ideas para compartirlas durante Reflexiona y repasa."]},{"id":"s058","nivel":1,"titulo":"Desayuno","fuente":{"pagina_impresa_inicio":42,"pagina_impresa_fin":42,"pagina_pdf_inicio":46,"pagina_pdf_fin":46},"tipo_contenido":"texto_extraido_del_manual","parrafos":["La hora de la comida es una gran oportunidad para conocer a los jóvenes y ayudarlos a sentirse cómodos. Durante las comidas, todo el personal debe ayudar a que los jóvenes se comporten correctamente y a que permanezcan en las zonas autorizadas. Sea un buen ejemplo. No fomente ni participe en conductas inapropiadas (bromas relacionadas con la comida, concursos de comida, etc.). Recuerde a los jóvenes que sean respetuosos con otros grupos en el comedor. Dejen limpio el lugar.","Anime a su compañía a comer juntos para fomentar la unidad. Si los participantes quieren comer con un amigo o familiar en otra compañía, respete su decisión."]},{"id":"s059","nivel":1,"titulo":"Reseña del estudio del Evangelio","fuente":{"pagina_impresa_inicio":42,"pagina_impresa_fin":43,"pagina_pdf_inicio":46,"pagina_pdf_fin":47},"tipo_contenido":"texto_extraido_del_manual","parrafos":["El estudio del Evangelio es un tiempo para que los jóvenes aumenten su amor por las Escrituras, aprendan cómo las Escrituras pueden bendecir su vida y desarrollen el hábito del estudio diario.","El estudio frecuente y eficaz del Evangelio nos acerca más a Jesucristo y nos da poder para resistir la tentación, evitar el engaño y permanecer en la senda de los convenios. Leer las Escrituras invita al Espíritu a estar con nosotros, ayudándonos a recibir revelación, obtener un testimonio y recibir consuelo. A medida que estudiamos, aprendemos doctrina que cambia nuestras acciones y conducta.","Su objetivo al dirigir el estudio del Evangelio debe ser ayudar a los jóvenes a aprender mientras enseña a la manera del Salvador. Al hacerlo, los jóvenes darán cabida en su corazón para que la semilla del Evangelio se siembre, se hinche y crezca."]},{"id":"s060","nivel":2,"titulo":"Preparación","fuente":{"pagina_impresa_inicio":43,"pagina_impresa_fin":43,"pagina_pdf_inicio":47,"pagina_pdf_fin":47},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• El estudio del Evangelio proporciona a cada consejero una oportunidad formal de enseñar. Prepárese bien. Su preparación espiritual diaria es vital. Ore, estudie las Escrituras y sea obediente. Su ejemplo será más impresionante que sus palabras; por lo tanto, practique lo que enseñe.","• Durante la planificación con el consejero adjunto en la mañana del Día 1, divida las responsabilidades diarias de enseñanza y planifique los pasajes de las Escrituras que usará durante la conferencia."]},{"id":"s061","nivel":2,"titulo":"Formato del estudio del Evangelio","fuente":{"pagina_impresa_inicio":43,"pagina_impresa_fin":43,"pagina_pdf_inicio":47,"pagina_pdf_fin":47},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Cada mañana, en el punto de reunión de la compañía y después de cantar y orar juntos, usted y su consejero adjunto deben enseñar una breve lección acerca del estudio del Evangelio para ayudar a los jóvenes a aplicar técnicas de estudio. Un consejero enseña y el otro consejero apoya con comentarios e ideas reflexivos. Ambos consejeros deben colocarse al frente del grupo, mostrando unidad mientras dirigen el análisis. Ayude a los jóvenes a captar la idea general de cómo se relacionan entre sí las lecciones del estudio del Evangelio de toda la semana. Todos los días, haga un repaso rápido de lo que se haya enseñado previamente.","La mejor forma en que los jóvenes pueden poner en práctica esas lecciones es en su estudio personal de las Escrituras. Practique lo que está enseñando; estudie las Escrituras durante el estudio del Evangelio y no converse con su(s) consejero(s) adjunto(s) ni haga otras cosas. Esté atento y a disposición de los jóvenes durante ese tiempo. Ayude a quienes lo requieran, tengan preguntas o estén distraídos o durmiendo. Sea sensible a la madurez espiritual de los jóvenes. Mantenga un ambiente reverente. Después de unos treinta minutos, invite a los jóvenes a volver a reunirse para compartir pensamientos y sentimientos entre ellos. Recuérdeles que hablen acerca de los principios que hayan aprendido, lo que hayan sentido y la técnica de estudio que hayan aplicado, en vez de limitarse a lo que han leído."]},{"id":"s062","nivel":1,"titulo":"Estudio del Evangelio","fuente":{"pagina_impresa_inicio":43,"pagina_impresa_fin":44,"pagina_pdf_inicio":47,"pagina_pdf_fin":48},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Siga el estudio del Evangelio del Día 2 como se indica a continuación. Recuerde que ser flexible al enseñar le permitirá seguir al Espíritu y enseñar de manera eficaz. SEGMENTO DURACIÓN Tiempo de enseñanza formal/análisis en 8:30–8:50 h grupo Tiempo de estudio personal 8:50–9:20 h Tiempo para compartir 09:20–9:30 h Cada día, al comienzo del estudio del Evangelio, recuerde a los jóvenes las metas de su compañía, verifique su progreso y continúe alentándolos."]},{"id":"s063","nivel":2,"titulo":"Tiempo de enseñanza formal/análisis en grupo (20 minutos)","fuente":{"pagina_impresa_inicio":44,"pagina_impresa_fin":44,"pagina_pdf_inicio":48,"pagina_pdf_fin":48},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Sugerencias para el estudio del Evangelio: Escudriñar, meditar y poner en práctica (5 minutos) Repase las sugerencias para el estudio del Evangelio que se encuentran en el Manual para el participante de FSY, pág. 26. Analice maneras de crear constantemente un ambiente para el estudio constructivo y exitoso de las Escrituras.","• Revelación personal (15 minutos) A fin de ayudar a los jóvenes a entender cómo prepararse para recibir revelación y descubrir cómo se sienten a veces las impresiones, lea las siguientes referencias de las Escrituras, agregue otras que desee utilizar y prepárese para dirigir un análisis basado en estas ideas concernientes a la revelación.","Recursos:","◦ 2 Nefi 4:15–16","◦ Doctrina y Convenios 8:2–3","◦ 1 Reyes 19:11–12","◦ Mateo 7:7–8","◦ Juan 14:26"]},{"id":"s064","nivel":2,"titulo":"Tiempo de estudio personal (30 minutos)","fuente":{"pagina_impresa_inicio":44,"pagina_impresa_fin":44,"pagina_pdf_inicio":48,"pagina_pdf_fin":48},"tipo_contenido":"texto_extraido_del_manual","parrafos":[]},{"id":"s065","nivel":2,"titulo":"Tiempo para compartir (10 minutos)","fuente":{"pagina_impresa_inicio":44,"pagina_impresa_fin":44,"pagina_pdf_inicio":48,"pagina_pdf_fin":48},"tipo_contenido":"texto_extraido_del_manual","parrafos":[]},{"id":"s066","nivel":1,"titulo":"Devocional matutino con el matrimonio director de sesión","fuente":{"pagina_impresa_inicio":44,"pagina_impresa_fin":45,"pagina_pdf_inicio":48,"pagina_pdf_fin":49},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Cada mañana, el matrimonio director de sesión presenta una lección edificante que se centra en el lema y lo desarrolla un poco más. Pida a los jóvenes que saquen su ejemplar de las Escrituras, el Manual para el participante de FSY y un bolígrafo antes de la primera oración. Recuérdeles que no guarden sus materiales hasta después de la última oración. Para fomentar la reverencia, permanezca de pie y preste atención a los jóvenes hasta que el coordinador se ponga de pie para dar comienzo a la reunión. Siéntese junto a su compañía y escuche al matrimonio director de sesión. Aliente a los jóvenes a ser reverentes y a prestar atención. Tome notas y prepare posibles preguntas para plantearlas durante Reflexiona y repasa."]},{"id":"s067","nivel":1,"titulo":"Clases","fuente":{"pagina_impresa_inicio":45,"pagina_impresa_fin":45,"pagina_pdf_inicio":49,"pagina_pdf_fin":49},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Cuando asista a las clases, siéntese entre los jóvenes en lugar de sentarse con otros consejeros. Sea un ejemplo para los jóvenes y ayúdelos a ser respetuosos y a estar atentos."]},{"id":"s068","nivel":1,"titulo":"Almuerzo","fuente":{"pagina_impresa_inicio":45,"pagina_impresa_fin":45,"pagina_pdf_inicio":49,"pagina_pdf_fin":49},"tipo_contenido":"texto_extraido_del_manual","parrafos":["La hora de la comida es una gran oportunidad para conocer a los jóvenes y ayudarlos a sentirse cómodos. Durante las comidas, todo el personal debe ayudar a que los jóvenes se comporten correctamente y a que permanezcan en las zonas autorizadas. Sea un buen ejemplo. No fomente ni participe en conductas inapropiadas (bromas relacionadas con la comida, concursos de comida, etc.). Recuerde a los jóvenes que sean respetuosos con otros grupos en el comedor. Dejen limpio el lugar.","Anime a su compañía a comer juntos para fomentar la unidad. Si los participantes quieren comer con un amigo o familiar en otra compañía, respete su decisión."]},{"id":"s069","nivel":1,"titulo":"Ensayo del programa musical","fuente":{"pagina_impresa_inicio":45,"pagina_impresa_fin":45,"pagina_pdf_inicio":49,"pagina_pdf_fin":49},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Anime a los jóvenes a participar en el Programa musical. Los jóvenes que participen en el Programa musical deben darse prisa al comer (deben pasar al frente de la fila si es necesario pero no deben ponerse delante de personas que no sean participantes de la conferencia FSY) y luego ir al lugar donde ensayan el Programa musical."]},{"id":"s070","nivel":1,"titulo":"Recuento de personas a la hora del almuerzo (Reunión con la compañía)","fuente":{"pagina_impresa_inicio":45,"pagina_impresa_fin":46,"pagina_pdf_inicio":49,"pagina_pdf_fin":50},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Lleve a cabo el recuento de personas después del almuerzo en la ubicación predeterminada de su compañía. Haga los anuncios y dé instrucciones para el resto de las actividades del día. Asegúrese de que los jóvenes sepan que deben comunicarse con usted, aunque participen en el programa musical o en el espectáculo de variedades. Informe del recuento de personas a su coordinador auxiliar y anote a cualquier joven que falte.","Sugerencias de anuncios","• Recuerde a los jóvenes los ensayos del programa musical y las audiciones para el espectáculo de variedades.","• Dígales cuándo y dónde deben reunirse después de la cena para preparar el estandarte y el verso cantado."]},{"id":"s071","nivel":1,"titulo":"Audiciones para el espectáculo de variedades","fuente":{"pagina_impresa_inicio":46,"pagina_impresa_fin":46,"pagina_pdf_inicio":50,"pagina_pdf_fin":50},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Anime a los jóvenes a que participen en la audición para el espectáculo de variedades. Repase con ellos las pautas para el espectáculo de variedades que se encuentran en la pág. 78 de su Manual para el participante de FSY a fin de que comprendan lo que se considera aceptable y apropiado. Recuérdeles que se inscriban temprano. Ayude a quienes no hayan sido seleccionados para el espectáculo de variedades a entender que la elección no siempre se basa en la habilidad o el talento, sino en la necesidad de una amplia variedad de actos para el espectáculo. Considere reservar tiempo más adelante en la sesión para aquellos que no hayan sido seleccionados para actuar en el espectáculo de variedades, a fin de que presenten sus actos solo para su compañía."]},{"id":"s072","nivel":1,"titulo":"Tiempo libre de los participantes","fuente":{"pagina_impresa_inicio":46,"pagina_impresa_fin":46,"pagina_pdf_inicio":50,"pagina_pdf_fin":50},"tipo_contenido":"texto_extraido_del_manual","parrafos":["El tiempo libre de los participantes es una oportunidad para que usted pase tiempo con los jóvenes y aprenda más sobre ellos. Como consejero, no se le requiere ayudar durante el tiempo libre, a menos que los líderes de sesión indiquen lo contrario."]},{"id":"s073","nivel":1,"titulo":"Reunión de coordinadores auxiliares/consejeros","fuente":{"pagina_impresa_inicio":46,"pagina_impresa_fin":46,"pagina_pdf_inicio":50,"pagina_pdf_fin":50},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Durante ese tiempo, su coordinador auxiliar le proporcionará capacitación complementaria y responderá sus preguntas. Esta reunión es obligatoria para todos los consejeros, excepto para aquellos asignados al programa musical o al espectáculo de variedades."]},{"id":"s074","nivel":1,"titulo":"Reunión con la compañía (recuento informal de personas)","fuente":{"pagina_impresa_inicio":46,"pagina_impresa_fin":46,"pagina_pdf_inicio":50,"pagina_pdf_fin":50},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Asegúrese de que los jóvenes estén preparados y vestidos apropiadamente para las actividades de la noche."]},{"id":"s075","nivel":1,"titulo":"Preparación del estandarte y los versos cantados","fuente":{"pagina_impresa_inicio":47,"pagina_impresa_fin":47,"pagina_pdf_inicio":51,"pagina_pdf_fin":51},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Su compañía preparará un estandarte y unos versos cantados para la competencia.","• Usted o su consejero adjunto recibirán un estandarte y materiales durante la reunión vespertina con el coordinador auxiliar.","• El estandarte se utilizará en otras actividades durante la conferencia."]},{"id":"s076","nivel":2,"titulo":"Reglas sobre el estandarte","fuente":{"pagina_impresa_inicio":47,"pagina_impresa_fin":47,"pagina_pdf_inicio":51,"pagina_pdf_fin":51},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• El estandarte debe ser apropiado y reflejar el carácter del nombre de la compañía.","• Solo los participantes deben dibujar o escribir en el estandarte; los consejeros no deben participar en la elaboración.","• El estandarte no debe llevar nombres ni títulos de la Deidad."]},{"id":"s077","nivel":2,"titulo":"Reglas en cuanto a los versos cantados","fuente":{"pagina_impresa_inicio":47,"pagina_impresa_fin":47,"pagina_pdf_inicio":51,"pagina_pdf_fin":51},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Su compañía preparará un verso cantado para presentarlo a los jueces (por lo general, el matrimonio director de sesión y los coordinadores). Los que sean seleccionados por los jueces se presentarán en la final de la competencia de versos cantados. Las siguientes reglas ayudarán a cerciorarse de que se cumplan las normas sobre lo que es apropiado y garantizarán la seguridad y la equidad:","• Los versos cantados no deben durar más de un minuto.","• Recuerde que los jueces califican el entusiasmo, la creatividad, la unidad del grupo y la interpretación en general.","• Los consejeros no pueden participar en los versos cantados, pero pueden alentar y ayudar con ideas. El propósito es que los jóvenes trabajen en grupo y que estén más unidos. Los consejeros son responsables de asegurarse de que los jóvenes comprendan y cumplan con las expectativas que se dan a continuación:","◦ No se permite levantar a las personas ni dar vueltas en el aire.","◦ A excepción de su estandarte, no se debe utilizar ningún accesorio.","◦ No se deben usar los nombres de los miembros de la Deidad.","◦ Si se utilizan letras o melodías, asegúrese de que dichas melodías provengan de canciones apropiadas y que todas las letras de los versos cantados sean apropiadas.","◦ No se permiten lenguaje ni acciones profanos, vulgares ni degradantes de ningún tipo."]},{"id":"s078","nivel":1,"titulo":"Pautas para los bailes de la conferencia FSY","fuente":{"pagina_impresa_inicio":48,"pagina_impresa_fin":48,"pagina_pdf_inicio":52,"pagina_pdf_fin":52},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Los bailes de la conferencia FSY proporcionan una experiencia social sana en la que el Espíritu puede estar presente. Se anima a los jóvenes a aprender nuevos bailes y a practicar el protocolo para el baile.","Después de preparar el estandarte y los versos cantados, y antes de que comience el baile, vuelva a reunirse con su compañía y repasen las pautas para los bailes de la conferencia (véase Manual para el participante de FSY, pág. 38).","Si le sobra tiempo, tal vez desee enseñar a los jóvenes un baile en fila o algunos movimientos divertidos de baile."]},{"id":"s079","nivel":1,"titulo":"Baile","fuente":{"pagina_impresa_inicio":48,"pagina_impresa_fin":48,"pagina_pdf_inicio":52,"pagina_pdf_fin":52},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Cuando lleguen al lugar del baile con su compañía, decidan en qué lugar se reunirán después del baile a fin de eliminar confusiones y permitir que los grupos se retiren de manera ordenada y oportuna.","Todos los consejeros deben contribuir a que se cumplan las normas del baile. Baile con los jóvenes en grupo, conózcalos y anímelos a bailar, pero no los obligue. No les prohíba usar el baño ni tomar agua en ningún momento durante el baile.","Los consejeros deben disfrutar del baile, pero recuerde que su prioridad es atender las necesidades de los jóvenes.","Nota: Si tiene jóvenes que sean sensibles a la música a alto volumen, tal vez desee prepararlos con anticipación para el ambiente y la energía del baile. Elabore un plan para que participen de maneras que puedan ampliar su zona de confort, pero de forma que aún se sientan seguros. Si hay jóvenes con discapacidades físicas, planifique con ellos con anticipación las maneras en que pueden participar."]},{"id":"s080","nivel":1,"titulo":"Anuncios y oración","fuente":{"pagina_impresa_inicio":48,"pagina_impresa_fin":48,"pagina_pdf_inicio":52,"pagina_pdf_fin":52},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Sugerencias de anuncios","• Confirme las asignaciones del devocional para los participantes del Día 3.","• Si corresponde: lleve su camiseta de participante mañana o haga planes para ponérsela durante el tiempo libre para prepararse para la noche de juegos."]},{"id":"s081","nivel":1,"titulo":"Devocional matutino para participantes","fuente":{"pagina_impresa_inicio":50,"pagina_impresa_fin":50,"pagina_pdf_inicio":54,"pagina_pdf_fin":54},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Sugerencias de anuncios","• Recuerde a los jóvenes dónde deben reunirse después del almuerzo para el recuento de personas.","• Invite a los jóvenes a buscar y anotar ideas para compartirlas durante Reflexiona y repasa."]},{"id":"s082","nivel":1,"titulo":"Estudio del Evangelio","fuente":{"pagina_impresa_inicio":50,"pagina_impresa_fin":50,"pagina_pdf_inicio":54,"pagina_pdf_fin":54},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Siga el estudio del Evangelio del Día 3 como se indica a continuación. Recuerde que ser flexible al enseñar le permitirá seguir al Espíritu y enseñar de manera eficaz. SEGMENTO DURACIÓN Tiempo de enseñanza formal/análisis en 8:30–8:45 h grupo Tiempo de estudio personal 8:45–9:20 h Tiempo para compartir 09:20–9:30 h Cada día, al comienzo del estudio del Evangelio, recuerde a los jóvenes las metas de su compañía, verifique su progreso y continúe alentándolos."]},{"id":"s083","nivel":2,"titulo":"Tiempo de enseñanza formal/análisis en grupo (15 minutos)","fuente":{"pagina_impresa_inicio":50,"pagina_impresa_fin":50,"pagina_pdf_inicio":54,"pagina_pdf_fin":54},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Hable con su grupo acerca de alguna ocasión en la que haya disfrutado de un verdadero banquete, tal como un día festivo o un evento familiar especial. Pida a los jóvenes que tengan en mente ese simbolismo al participar en este análisis.","• Lea 2 Nefi 32:3 para comenzar el análisis del estudio del Evangelio en grupo Recursos:","◦ 2 Nefi 4:15–16","◦ Alma 17:2","◦ Alma 37:44–45"]},{"id":"s084","nivel":2,"titulo":"Tiempo de estudio personal (35 minutos)","fuente":{"pagina_impresa_inicio":50,"pagina_impresa_fin":50,"pagina_pdf_inicio":54,"pagina_pdf_fin":54},"tipo_contenido":"texto_extraido_del_manual","parrafos":[]},{"id":"s085","nivel":2,"titulo":"Tiempo para compartir (10 minutos)","fuente":{"pagina_impresa_inicio":50,"pagina_impresa_fin":50,"pagina_pdf_inicio":54,"pagina_pdf_fin":54},"tipo_contenido":"texto_extraido_del_manual","parrafos":[]},{"id":"s086","nivel":2,"titulo":"Recuento de personas a la hora del almuerzo (Reunión con la compañía)","fuente":{"pagina_impresa_inicio":51,"pagina_impresa_fin":51,"pagina_pdf_inicio":55,"pagina_pdf_fin":55},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Lleve a cabo el recuento de personas después del almuerzo en la ubicación predeterminada de su compañía. Haga los anuncios.","Sugerencias de anuncios","• Pida a los participantes que se pongan la camiseta de participante durante el tiempo libre para que estén listos para la noche de juegos.","• Recuerde a los participantes cuándo y dónde deben reunirse después de la cena para el recuento de personas y la preparación de la noche de juegos."]},{"id":"s087","nivel":1,"titulo":"Reunión con la compañía (recuento informal de personas)","fuente":{"pagina_impresa_inicio":51,"pagina_impresa_fin":51,"pagina_pdf_inicio":55,"pagina_pdf_fin":55},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Asegúrese de que los jóvenes estén preparados y vestidos apropiadamente para las actividades de la noche. Todos los participantes deben llevar puesta su camiseta de participante."]},{"id":"s088","nivel":1,"titulo":"Preparación para la noche de juegos","fuente":{"pagina_impresa_inicio":51,"pagina_impresa_fin":51,"pagina_pdf_inicio":55,"pagina_pdf_fin":55},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Prepárese para enseñar todos los juegos durante ese tiempo. Puede enseñar un juego llamando al frente a un par de participantes, demostrando cómo se juega y luego respondiendo cualquier pregunta.","Después de hacer la demostración de cada juego, practiquen su verso cantado por última vez y dejen suficiente tiempo para llegar al lugar de la noche de juegos. Todos deben llegar a tiempo a la noche de juegos para que las cosas salgan bien y para que la noche de comida favorita comience a tiempo."]},{"id":"s089","nivel":1,"titulo":"Noche de juegos","fuente":{"pagina_impresa_inicio":51,"pagina_impresa_fin":51,"pagina_pdf_inicio":55,"pagina_pdf_fin":55},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Ayude a los jóvenes a estar unidos como compañía, a sentir el Espíritu mientras se divierten y a sentirse cómodos al interactuar con los demás."]},{"id":"s090","nivel":2,"titulo":"Instrucciones","fuente":{"pagina_impresa_inicio":51,"pagina_impresa_fin":52,"pagina_pdf_inicio":55,"pagina_pdf_fin":56},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Fomente un ambiente de ánimo y trabajo en equipo. La noche de juegos tiene que ver con crear unidad dentro de su compañía, no de competir. Los participantes deben llevar puesta su camiseta de participante. Se les debe recomendar encarecidamente que lleven una botella de agua llena. Después de llegar al campo de juego, preséntese ante el coordinador auxiliar responsable, quien le dirá qué coordinador auxiliar estará con usted en la noche de juegos y lo dirigirá a su ubicación asignada en el campo. Su grupo permanecerá con su coordinador auxiliar durante toda la noche, a medida que van rotando por los diferentes juegos. A menos que se indique algo diferente, los jueces acudirán a su ubicación para escuchar el verso cantado de su compañía. Durante los breves intervalos entre juegos, mientras el coordinador auxiliar prepara el siguiente juego, mantenga a los participantes de su compañía juntos, activos y animados. El primer descanso podría ser una oportunidad para tomar una fotografía de la compañía. Envíe las fotografías al coordinador auxiliar encargado de la presentación de diapositivas para que su compañía pueda ser incluida.","Al retirarse de la ubicación de la noche de juegos, asegúrese de que los participantes recojan todas sus pertenencias.","Nota: Si tiene jóvenes que son sensibles a los ruidos fuertes, a los gritos, a ver a otros pasar corriendo junto a ellos, etc., tal vez desee prepararlos con anticipación para el ambiente y la energía de la noche de juegos. Elabore un plan para que participen de maneras que puedan ampliar su zona de confort, pero de forma que aún se sientan seguros. Si hay jóvenes con discapacidades físicas, planifique con ellos con anticipación las maneras en que pueden participar."]},{"id":"s091","nivel":2,"titulo":"Juegos (véanse págs. 90–93)","fuente":{"pagina_impresa_inicio":52,"pagina_impresa_fin":52,"pagina_pdf_inicio":56,"pagina_pdf_fin":56},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Árbol, tronco, puente","• Sonidos de animales","• Por dentro y por fuera","• Una casa de orden (alternativo)"]},{"id":"s092","nivel":1,"titulo":"Competencia de versos cantados","fuente":{"pagina_impresa_inicio":52,"pagina_impresa_fin":52,"pagina_pdf_inicio":56,"pagina_pdf_fin":56},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Después de haber visto todos los versos cantados durante la noche de juegos, los jueces escogerán algunos versos cantados para que se presenten a toda la sesión en la competencia final. Anime a los jóvenes a mostrar su apoyo y ser siempre positivos. La competencia debe ser emocionante y cordial, no intensa ni divisiva.","Si la noche de juegos se retrasa, se alienta a los coordinadores a posponer los versos cantados hasta el Día 5 para evitar retrasar la noche de comida favorita."]},{"id":"s093","nivel":1,"titulo":"Noche de comida favorita","fuente":{"pagina_impresa_inicio":52,"pagina_impresa_fin":53,"pagina_pdf_inicio":56,"pagina_pdf_fin":57},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Cree un ambiente sano donde los jóvenes puedan conectarse con su consejero y con su grupo de consejeros mientras disfrutan de su comida favorita. Como consejero que dirige esta actividad, usted puede ayudarlos a sentirse amados y validados por medio de las experiencias que compartan.","Recuerde, la forma en que termine el Día 3 marcará la pauta para las actividades del Día 4. La noche de comida favorita debe ser una pequeña reunión con su grupo de consejeros, que se lleva a cabo en el dormitorio de los jóvenes o cerca de él, si es posible.","• Mantenga un ambiente edificante; no permita que los jóvenes cuenten chismes o hablen de manera negativa.","• Tranquilice a su grupo al final de la actividad para invitar al Espíritu a la actividad Reflexiona y repasa."]},{"id":"s094","nivel":2,"titulo":"Limpieza","fuente":{"pagina_impresa_inicio":53,"pagina_impresa_fin":53,"pagina_pdf_inicio":57,"pagina_pdf_fin":57},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Deseche toda la basura después de la actividad. Si es posible, lleve la basura a los contenedores externos, asegurándose de que haya al menos un consejero por cada pasillo o área de dormitorios disponible para los jóvenes durante el tiempo para meditar."]},{"id":"s095","nivel":1,"titulo":"Anuncios y oración","fuente":{"pagina_impresa_inicio":53,"pagina_impresa_fin":53,"pagina_pdf_inicio":57,"pagina_pdf_fin":57},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Sugerencias de anuncios","• Anuncie quiénes son los jóvenes que han sido elegidos para actuar en el espectáculo de variedades (véanse las pautas para el espectáculo de variedades en la pág. 104). Dígales que deben asistir al ensayo general del espectáculo de variedades el Día 4 y siga estas pautas:","◦ Lleven su almuerzo al ensayo o coman rápidamente y lleguen lo antes posible.","◦ Vístanse como lo harán para el espectáculo final.","◦ Afinen los instrumentos y hagan otros preparativos, según sea necesario.","• Confirme las asignaciones del devocional para participantes del Día 4 y recuérdeles a los jóvenes que la vestimenta para el Día 4 es ropa de domingo."]},{"id":"s096","nivel":1,"titulo":"Desayuno","fuente":{"pagina_impresa_inicio":55,"pagina_impresa_fin":55,"pagina_pdf_inicio":59,"pagina_pdf_fin":59},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Sugerencias de anuncios","• Recuerde a los participantes en el espectáculo de variedades que lleven consigo toda la utilería y el vestuario al ensayo general.","• Dé cualquier instrucción adicional para el ensayo general del espectáculo de variedades."]},{"id":"s097","nivel":1,"titulo":"Estudio del Evangelio","fuente":{"pagina_impresa_inicio":55,"pagina_impresa_fin":55,"pagina_pdf_inicio":59,"pagina_pdf_fin":59},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Siga el estudio del Evangelio del Día 4 como se indica a continuación. Recuerde que ser flexible al enseñar le permitirá seguir al Espíritu y enseñar de manera eficaz. SEGMENTO DURACIÓN Tiempo de enseñanza formal/análisis en 8:30–8:45 h grupo Tiempo de estudio personal 8:45–9:20 h Tiempo para compartir 09:20–9:30 h Cada día, al comienzo del estudio del Evangelio, recuerde a los jóvenes las metas de su compañía, verifique su progreso y continúe alentándolos."]},{"id":"s098","nivel":2,"titulo":"Tiempo de enseñanza formal/análisis en grupo (15 minutos)","fuente":{"pagina_impresa_inicio":55,"pagina_impresa_fin":55,"pagina_pdf_inicio":59,"pagina_pdf_fin":59},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Hable con su grupo acerca de algún personaje de las Escrituras con quien se identifique (por ejemplo, Nefi, porque fue perseguido por guardar los mandamientos).","• Lea 1 Nefi 4:1–3 con los jóvenes para comenzar el análisis en grupo. Recursos:","◦ Mateo 7:24–27","◦ 1 Nefi 19:22–23","◦ 2 Nefi 6:5","◦ 2 Nefi 11:2, 8"]},{"id":"s099","nivel":2,"titulo":"Tiempo de estudio personal (35 minutos)","fuente":{"pagina_impresa_inicio":55,"pagina_impresa_fin":55,"pagina_pdf_inicio":59,"pagina_pdf_fin":59},"tipo_contenido":"texto_extraido_del_manual","parrafos":[]},{"id":"s100","nivel":2,"titulo":"Tiempo para compartir (10 minutos)","fuente":{"pagina_impresa_inicio":55,"pagina_impresa_fin":55,"pagina_pdf_inicio":59,"pagina_pdf_fin":59},"tipo_contenido":"texto_extraido_del_manual","parrafos":[]},{"id":"s101","nivel":1,"titulo":"Actividad de los Hombres Jóvenes y las Mujeres Jóvenes","fuente":{"pagina_impresa_inicio":56,"pagina_impresa_fin":56,"pagina_pdf_inicio":60,"pagina_pdf_fin":60},"tipo_contenido":"texto_extraido_del_manual","parrafos":[]},{"id":"s102","nivel":2,"titulo":"El Libro de Mormón: Otro Testamento de Jesucristo","fuente":{"pagina_impresa_inicio":56,"pagina_impresa_fin":56,"pagina_pdf_inicio":60,"pagina_pdf_fin":60},"tipo_contenido":"texto_extraido_del_manual","parrafos":[]},{"id":"s103","nivel":2,"titulo":"Responsabilidad","fuente":{"pagina_impresa_inicio":57,"pagina_impresa_fin":58,"pagina_pdf_inicio":61,"pagina_pdf_fin":62},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Su función consiste en guiar a los jóvenes a medida que completan la actividad de las páginas 66–77 del Manual para el participante. Facilite un análisis acerca de los testigos espirituales y físicos del Libro de Mormón. Enseñe los siguientes principios acerca de la revelación personal para que los jóvenes comprendan cómo el Espíritu testifica de la verdad: “Sí, he aquí, hablaré a tu mente y a tu corazón por medio del Espíritu Santo que vendrá sobre ti y morará en tu corazón. Ahora, he aquí, este es el espíritu de revelación”.","Doctrina y Convenios 8:2–3 Haga hincapié en que un testimonio espiritual personal (en el corazón) da lugar a un testimonio más profundo y significativo, en comparación con la evidencia física (en la mente). La evidencia física es importante, pero es solo una parte de la estructura para edificar el testimonio. Céntrese en lograr los objetivos de la actividad y en ayudar a los jóvenes a comprender la importancia de tener un testimonio personal del Libro de Mormón.","Objetivos Poniendo el Libro de Mormón en el centro de esta actividad, ayude a los jóvenes a hacer lo siguiente:","• Aumentar su testimonio del Libro de Mormón.","• Familiarizarse con las evidencias y los testigos del Libro de Mormón y comprender su importancia.","• Fortalecer su testimonio de José Smith como profeta, vidente y revelador.","• Comprometerse a vivir las verdades eternas que se encuentran en el Libro de Mormón a fin de acercarse más a Jesucristo.","Preparación Su preparación es crucial para el éxito de esta actividad. Aunque esta actividad tiene un bosquejo detallado, es posible que tenga que adaptar la lección para satisfacer las necesidades particulares de su grupo. Usted debe:","• Conocer y comprender los objetivos de la actividad de los Hombres Jóvenes y las Mujeres Jóvenes.","• Leer toda la actividad en el Manual para el participante y comprender todos los temas para que pueda dirigir un análisis significativo de manera eficaz.","• Leer y estudiar con espíritu de oración los recursos, de ser posible.","• Recursos:","◦ Neil L. Andersen, “José Smith”, Liahona , noviembre de 2014","◦ Tad R. Callister, “El testigo convincente de Dios: El Libro de Mormón”, Liahona , noviembre de 2017","◦ Shayne M. Bowen, “La función del Libro de Mormón en la conversión”, Liahona , noviembre de 2018.","Duración Las mujeres jóvenes participarán en la actividad de los Hombres Jóvenes y de las Mujeres Jóvenes durante la primera rotación, mientras que los hombres jóvenes asistirán al devocional matutino. A continuación, los hombres jóvenes se intercambiarán con las mujeres jóvenes y participarán en la actividad mientras ellas se reúnen con el matrimonio director de sesión para el devocional matutino.","HORARIO DE LAS MUJERES HORARIO DE LOS JÓVENES HOMBRES JÓVENES ACTIVIDAD 9:45–10:05 h 11:15–11:35 h Dirige el coordinador auxiliar.","Canción, oración, introducción a la actividad. 10:05–10:15 h Dirigirse a las sesiones de grupo de consejeros. 11:35–11:45 h 10:15–10:45 h 11:45–12:15 h Análisis con el consejero y actividad del Manual para el participante. 10:45–10:55 h Actividad de aplicación. 12:15–12:25 h 10:55–11:00 h 12:25–12:30 h Testimonio del consejero y de los participantes, oración"]},{"id":"s104","nivel":2,"titulo":"Formato de la actividad de los Hombres Jóvenes y de las Mujeres Jóvenes","fuente":{"pagina_impresa_inicio":58,"pagina_impresa_fin":59,"pagina_pdf_inicio":62,"pagina_pdf_fin":63},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Canción, oración, introducción a la actividad por el coordinador auxiliar (20 minutos) Reúnanse en el lugar asignado.","Pasar a las sesiones de grupo de consejeros (10 minutos) Busque un espacio apropiado al aire libre, a menos que se indique lo contrario, que no bloquee las aceras o escaleras ni interrumpa otras actividades, y que esté alejado de otros grupos o distracciones.","Análisis del consejero (30 minutos) Enseñe el material que se encuentra en el Manual para el participante. Hay varios temas de análisis para esta actividad, por lo que debería considerar pedir a cada joven de su grupo que elija un tema, lea los recursos y enseñe al grupo lo que aprendió. Esto ayudará a que los jóvenes participen y se interesen y hará que la actividad se desarrolle mejor. Proceda a analizar los temas uno por uno, dando tiempo para analizar las preguntas proporcionadas en busca de nuevas perspectivas. Invite a los jóvenes a anotar las impresiones que reciban durante el análisis. Dependiendo de su grupo, es posible que dediquen diferentes períodos de tiempo a los distintos temas y es posible que no tengan suficiente tiempo para analizarlos todos. Recuerde que debe centrarse en alcanzar los objetivos de la actividad.","Actividad de aplicación (10 minutos) Invite a los jóvenes a dedicar ese tiempo a meditar, orar y terminar la parte final de la actividad de los Hombres Jóvenes y de las Mujeres Jóvenes (véase Manual para el participante, págs. 67–68).","Testimonio del consejero y participantes, oración (5 minutos)","• Invite a los jóvenes a compartir un breve testimonio de lo que aprendieron.","• Concluya con su propio breve testimonio de las verdades analizadas, haciendo hincapié en cómo son una bendición en su vida. Su testimonio será un buen ejemplo para los jóvenes que vayan a compartir su testimonio más adelante durante la reunión de testimonios.","• Pida a alguien que ofrezca la última oración. Nota: Antes de ir a almorzar, asegúrese de saber quiénes son los jóvenes que participarán en el espectáculo de variedades o en el programa musical. Confirme que entienden cuándo y dónde deben estar."]},{"id":"s105","nivel":1,"titulo":"Almuerzo","fuente":{"pagina_impresa_inicio":59,"pagina_impresa_fin":59,"pagina_pdf_inicio":63,"pagina_pdf_fin":63},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Sugerencias de anuncios","• Recuerde a los jóvenes cuándo y dónde deben reunirse después del almuerzo para el espectáculo de variedades."]},{"id":"s106","nivel":1,"titulo":"Recuento de personas a la hora del almuerzo (Reunión con la compañía)","fuente":{"pagina_impresa_inicio":59,"pagina_impresa_fin":59,"pagina_pdf_inicio":63,"pagina_pdf_fin":63},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Lleve a cabo el recuento de personas después del almuerzo en la ubicación predeterminada de su compañía. Dé los anuncios necesarios."]},{"id":"s107","nivel":1,"titulo":"Pautas para el espectáculo de variedades","fuente":{"pagina_impresa_inicio":59,"pagina_impresa_fin":59,"pagina_pdf_inicio":63,"pagina_pdf_fin":63},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Repase las pautas para la audiencia en el Manual para el participante, pág. 79."]},{"id":"s108","nivel":1,"titulo":"Espectáculo de variedades","fuente":{"pagina_impresa_inicio":59,"pagina_impresa_fin":59,"pagina_pdf_inicio":63,"pagina_pdf_fin":63},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Siéntese junto a sus jóvenes. Recuérdeles que deben mostrar apoyo y respeto."]},{"id":"s109","nivel":1,"titulo":"Cena","fuente":{"pagina_impresa_inicio":60,"pagina_impresa_fin":60,"pagina_pdf_inicio":64,"pagina_pdf_fin":64},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Algunos de los jóvenes necesitarán cenar rápidamente para poder participar en el programa musical. El coordinador auxiliar del programa musical dirigirá el análisis sobre la reverencia y el testimonio de esos jóvenes. Esté atento a los participantes que cantan en el programa musical para que pueda pasar a la siguiente actividad con los otros jóvenes. Asegúrese de que sepan cuándo y dónde reunirse."]},{"id":"s110","nivel":1,"titulo":"Análisis sobre la reverencia y el testimonio","fuente":{"pagina_impresa_inicio":60,"pagina_impresa_fin":60,"pagina_pdf_inicio":64,"pagina_pdf_fin":64},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Después de la cena, encuéntrense en el punto de reunión de su compañía. Comiencen con un himno y lean Doctrina y Convenios 88:67–68 como compañía. Analicen brevemente la doctrina y el propósito de la reverencia. Enseñe a los jóvenes que la reverencia no es solo estar callado, sino que es una condición del ser. Ayúdelos a entender cómo la reverencia los ayudará a recibir revelación.","Pida a los jóvenes que busquen “Un testimonio del Evangelio” en su Manual para el participante, pág. 81. Valiéndose de las referencias de esta página, dirija un análisis para ayudar a los jóvenes a entender lo que es y lo que no es un testimonio. Invite a los jóvenes a pensar en lo que han aprendido durante el día y cómo pueden seguir preparándose para las actividades vespertinas y para la reunión de testimonios."]},{"id":"s111","nivel":1,"titulo":"Reunión de testimonios","fuente":{"pagina_impresa_inicio":60,"pagina_impresa_fin":60,"pagina_pdf_inicio":64,"pagina_pdf_fin":64},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Después del Programa musical y del devocional vespertino, un coordinador enviará a todos a la reunión de testimonios. Su coordinador auxiliar le informará dónde su compañía tendrá la reunión de testimonios y quién dirigirá (véase de la responsabilidad de la reunión de testimonios en la pág. 17). Ayude a los jóvenes a permanecer reverentes y centrados en sentir el Espíritu."]},{"id":"s112","nivel":1,"titulo":"Anuncios y oración","fuente":{"pagina_impresa_inicio":60,"pagina_impresa_fin":60,"pagina_pdf_inicio":64,"pagina_pdf_fin":64},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Sugerencias de anuncios","• Confirmar las asignaciones del devocional para los participantes del Día 5."]},{"id":"s113","nivel":1,"titulo":"Estudio del Evangelio","fuente":{"pagina_impresa_inicio":62,"pagina_impresa_fin":62,"pagina_pdf_inicio":66,"pagina_pdf_fin":66},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Siga el estudio del Evangelio del Día 5 como se indica a continuación. Recuerde que ser flexible al enseñar le permitirá seguir al Espíritu y enseñar de manera eficaz. SEGMENTO DURACIÓN Tiempo de enseñanza formal/análisis en 8:30–8:45 h grupo Tiempo de estudio personal 8:45–9:20 h Tiempo para compartir 09:20–9:30 h"]},{"id":"s114","nivel":2,"titulo":"Tiempo de enseñanza formal/análisis en grupo (15 minutos)","fuente":{"pagina_impresa_inicio":62,"pagina_impresa_fin":62,"pagina_pdf_inicio":66,"pagina_pdf_fin":66},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Analice con los jóvenes el hecho de que cada persona siente el Espíritu Santo a su propia manera. En la Biblia, con frecuencia se describe como “una voz apacible y delicada” (véase 1 Reyes 19:11–12), que casi parece susurrar a la mente.","• Podrían analizar los conceptos de prepararse para la revelación y reconocer las impresiones del Espíritu Santo.","Recursos:","◦ Amós 3:7","◦ Mateo 16:13–18","◦ Alma 17:2–3","◦ Doctrina y Convenios 76:5–10"]},{"id":"s115","nivel":2,"titulo":"Tiempo de estudio personal (35 minutos)","fuente":{"pagina_impresa_inicio":62,"pagina_impresa_fin":62,"pagina_pdf_inicio":66,"pagina_pdf_fin":66},"tipo_contenido":"texto_extraido_del_manual","parrafos":[]},{"id":"s116","nivel":2,"titulo":"Tiempo para compartir (10 minutos)","fuente":{"pagina_impresa_inicio":62,"pagina_impresa_fin":62,"pagina_pdf_inicio":66,"pagina_pdf_fin":66},"tipo_contenido":"texto_extraido_del_manual","parrafos":[]},{"id":"s117","nivel":1,"titulo":"Repaso del establecimiento de metas","fuente":{"pagina_impresa_inicio":62,"pagina_impresa_fin":62,"pagina_pdf_inicio":66,"pagina_pdf_fin":66},"tipo_contenido":"texto_extraido_del_manual","parrafos":["SEGMENTO DURACIÓN Lección práctica 9:30–9:40 h Reunión de análisis 9:40–9:55 h Conclusión 09:55–10:00 h"]},{"id":"s118","nivel":2,"titulo":"Objetivos","fuente":{"pagina_impresa_inicio":63,"pagina_impresa_fin":63,"pagina_pdf_inicio":67,"pagina_pdf_fin":67},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Esta lección tiene como objetivo ayudar a los jóvenes a hacer lo siguiente:","• Reconocer el efecto que el fijar metas puede tener en su vida.","• Reflexionar sobre lo que aprendieron al fijar metas individuales y de la compañía.","• Celebrar su progreso y ayudarlos a tener sentimientos positivos sobre su progreso.","• Fortalecerse para que sigan fijando metas cuando regresen a casa."]},{"id":"s119","nivel":2,"titulo":"Instrucciones","fuente":{"pagina_impresa_inicio":63,"pagina_impresa_fin":63,"pagina_pdf_inicio":67,"pagina_pdf_fin":67},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Justo después del estudio del Evangelio, pida a los jóvenes que permanezcan en el lugar de la compañía y comiencen la actividad de repaso del establecimiento de metas."]},{"id":"s120","nivel":2,"titulo":"Introducción","fuente":{"pagina_impresa_inicio":63,"pagina_impresa_fin":63,"pagina_pdf_inicio":67,"pagina_pdf_fin":67},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Utilice la lección práctica para comenzar la actividad. Comenzar con una lección práctica tiene un propósito triple: (1) crear una separación del estudio del Evangelio, (2) proporcionar una oportunidad de enseñanza interesante y (3) ayudar a los jóvenes a revitalizarse y volver a centrarse."]},{"id":"s121","nivel":2,"titulo":"Lección práctica (10 minutos)","fuente":{"pagina_impresa_inicio":63,"pagina_impresa_fin":63,"pagina_pdf_inicio":67,"pagina_pdf_fin":67},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Pida a los participantes que formen dos filas de igual longitud colocándose uno al lado del otro, hombro con hombro. Las filas deben estar una frente a la otra y estar separadas por aproximadamente un brazo de distancia. Luego, cada participante debe mirar a otro participante directamente frente a él. Si hay un número impar de participantes, un consejero debe participar para igualar los números.","Pida a los jóvenes de la fila A que dediquen 30 segundos a observar todo lo relacionado con su compañero de la fila B (cómo se peina, si lleva calcetines y zapatos, si tiene los pantalones arremangados, etc.). Luego haga que la fila A se dé la vuelta para que quede de espaldas a la fila B.","Mientras están dados vuelta, dé 30 segundos a la fila B para que cambien algo de su apariencia (que saquen un bolsillo para afuera, se quiten un calcetín o un pendiente, se pasen el cabello detrás de una oreja, se pongan los zapatos en el otro pie, etc.; permítales ser creativos). Después de que hayan pasado 30 segundos, haga que la fila A gire y miren a sus compañeros nuevamente.","A continuación, los participantes tratan de identificar el cambio realizado por su compañero. Si fuera necesario, no dude en fijar un límite de tiempo (entre 30 segundos y 2 minutos). Cambie la función de cada fila y vuelva a realizar la actividad. Una vez que ambas filas hayan tenido la oportunidad de ser observadores, tome tiempo para hacer un análisis."]},{"id":"s122","nivel":2,"titulo":"Reunión de análisis (15 minutos)","fuente":{"pagina_impresa_inicio":64,"pagina_impresa_fin":64,"pagina_pdf_inicio":68,"pagina_pdf_fin":68},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Analice la lección práctica en términos del proceso de fijar metas. El análisis debe conducir de manera natural a una conversación sobre los resultados deseados del establecimiento de metas y las formas en que el proceso se puede aplicar en su vida diaria. Para guiar el análisis, utilice las preguntas de la página 96 del Manual para el participante, así como los objetivos de la actividad de repaso del establecimiento de metas. Recuerde que el análisis no debe convertirse en un intercambio de metas, sino que debe permanecer centrado en el proceso y los resultados finales del establecimiento de metas.","• Enseñe a los jóvenes que lo que aprendan en las conferencias FSY tendrá un efecto en su vida solamente si lo ponen en práctica.","• Ayúdelos a reconocer los principios que han estado viviendo en la sesión FSY, tales como el estudio de las Escrituras, la oración, obedecer las reglas, rodearse de buenos amigos y buenas personas, conversaciones sobre el Evangelio, entre otros.","• Ayude a los jóvenes a entender el significado de progresar en la senda de los convenios. “Manténganse en la senda de los convenios. Su compromiso de seguir al Salvador al hacer convenios con Él y luego guardar esos convenios abrirá la puerta a toda bendición y privilegio espiritual que están al alcance de hombres, mujeres y niños en todas partes. […] Los invito con toda la esperanza de mi corazón a que, por favor, regresen. Cualesquiera sean sus preocupaciones, sean cuales sean sus desafíos, hay un lugar para ustedes en esta, la Iglesia del Señor. Ustedes y las generaciones aún por venir serán bendecidos por las acciones que tomen ahora para regresar a la senda de los convenios”.","Russell M. Nelson, “Un mensaje de la Primera Presidencia”, 16 de enero de 2018, pág. 3, LaIglesiadeJesucristo.org"]},{"id":"s123","nivel":2,"titulo":"Conclusión (5 minutos)","fuente":{"pagina_impresa_inicio":64,"pagina_impresa_fin":64,"pagina_pdf_inicio":68,"pagina_pdf_fin":68},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Ayude a los jóvenes a descubrir cómo el proceso de fijar metas, junto con vivir el Evangelio todos los días, los ayudará a acercarse más al Salvador. Anímelos a prepararse para la actividad Llévatelo a casa de la compañía de esa noche pensando en las metas en las que les gustaría centrarse cuando regresen a casa. Invítelos a utilizar la conferencia FSY para guiarlos hacia el futuro. Comparta con ellos la felicidad, la fortaleza y el poder que provienen de vivir el Evangelio, trabajar para lograr las metas y llegar a ser más semejantes al Salvador."]},{"id":"s124","nivel":1,"titulo":"Actividad de la guía Para la Fortaleza","fuente":{"pagina_impresa_inicio":65,"pagina_impresa_fin":65,"pagina_pdf_inicio":69,"pagina_pdf_fin":69},"tipo_contenido":"texto_extraido_del_manual","parrafos":["de la Juventud Un coordinador auxiliar presentará esta actividad y los consejeros dirigirán la parte del análisis en grupo."]},{"id":"s125","nivel":2,"titulo":"Objetivo","fuente":{"pagina_impresa_inicio":65,"pagina_impresa_fin":65,"pagina_pdf_inicio":69,"pagina_pdf_fin":69},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Ayude a los participantes a entusiasmarse con Para la Fortaleza de la Juventud: Una guía para tomar decisiones (que se encuentra al final de ambos manuales de FSY), ayúdelos a comprender el propósito y la inspiración detrás de la misma, y bríndeles una experiencia con la guía que pueda fortalecer su fe en Jesucristo.","Aunque muchos participantes tendrán conocimiento previo de la guía Para la Fortaleza de la Juventud , no todos lo tendrán. Tenga en cuenta el grado de familiaridad de cada alumno con las normas para los jóvenes.","En lugar de centrarse en las normas específicas que ya no se mencionan en la guía actualizada, utilice este tiempo para que los jóvenes desarrollen una confianza sólida en el nuevo material, así como también la fe en Jesucristo. No emita juicios sobre versiones anteriores de Para la Fortaleza de la Juventud ni preste atención específica a la manera en que se ha actualizado el cuadernillo. Jesucristo es la “fortaleza de la juventud” y esta guía tiene la intención de guiar a los jóvenes hacia Él (véase Dieter F. Uchtdorf, “Jesucristo es la fortaleza de la juventud”, Liahona , noviembre de 2022)."]},{"id":"s126","nivel":2,"titulo":"Sesión de grupo de la compañía (40 minutos)","fuente":{"pagina_impresa_inicio":65,"pagina_impresa_fin":65,"pagina_pdf_inicio":69,"pagina_pdf_fin":69},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Ayude a los jóvenes a sentir el gozo de aprender junto a sus compañeros. Usted los dirigirá mientras participan de un juego y proponen ideas sobre cómo pueden aplicar Para la Fortaleza de la Juventud a su vida. Usted promoverá el estudio reflexivo y el análisis de la guía Para la Fortaleza de la Juventud ."]},{"id":"s127","nivel":2,"titulo":"Juego (20 minutos)","fuente":{"pagina_impresa_inicio":65,"pagina_impresa_fin":66,"pagina_pdf_inicio":69,"pagina_pdf_fin":70},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Barcos y marineros Objetivo del juego: Guiar de forma segura el barco de un lado a otro del salón sin que choque con los obstáculos.","Instrucciones: Asigne a cuatro o cinco jóvenes a ser “obstáculos” y pídales que se coloquen cerca del centro del salón. Pida al resto de la compañía que forme grupos de dos en dos. En cada grupo de dos, un joven será el “barco“ y el otro será un “marinero”. El barco cierra los ojos y el marinero utiliza la voz para guiar el barco alrededor de los obstáculos de un lado a otro del salón. Los marineros no pueden tocar a los barcos mientras los guían. Los jóvenes que actúan como obstáculos deben permanecer en su lugar sin hablar; pueden extender los brazos y las piernas, pero no pueden moverse para tocar los barcos.","Pueden jugar el juego varias veces, agregando variaciones como las siguientes:","• Los obstáculos pueden hablar para intentar distraer a los barcos de modo que no puedan escuchar a los marineros.","• Los obstáculos pueden mover los brazos y estirarse para tocar los barcos.","• Los barcos pueden ver dónde están los obstáculos antes de cerrar los ojos.","• Los marineros solo pueden susurrar.","• Los obstáculos se hacen a un lado y los marineros guían a sus barcos a través de un salón vacío sin que los barcos sepan que está vacío."]},{"id":"s128","nivel":1,"titulo":"Reunión de análisis","fuente":{"pagina_impresa_inicio":66,"pagina_impresa_fin":66,"pagina_pdf_inicio":70,"pagina_pdf_fin":70},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Analice junto con los jóvenes cómo este juego podría aplicarse a la guía Para la Fortaleza de la Juventud . Por ejemplo, los marineros son las pautas de la guía Para la Fortaleza de la Juventud y nosotros somos los barcos. Los obstáculos son las influencias del mundo. Este es solo un ejemplo de cómo se puede aplicar este juego. Los jóvenes señalarán muchos ejemplos y analogías diferentes. ¿Cómo puede el juego aplicarse a nuestra vida en la actualidad?"]},{"id":"s129","nivel":2,"titulo":"Transición (5 minutos)","fuente":{"pagina_impresa_inicio":66,"pagina_impresa_fin":66,"pagina_pdf_inicio":70,"pagina_pdf_fin":70},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Termine el juego y reúnase con su compañía. Asegúrese de que todos tengan acceso a la guía Para la Fortaleza de la Juventud o de que estén con alguien que sí lo tenga."]},{"id":"s130","nivel":2,"titulo":"Familiarizar a los jóvenes con la guía Para la Fortaleza","fuente":{"pagina_impresa_inicio":66,"pagina_impresa_fin":67,"pagina_pdf_inicio":70,"pagina_pdf_fin":71},"tipo_contenido":"texto_extraido_del_manual","parrafos":["de la Juventud (15 minutos) Conceda unos minutos para que los jóvenes se familiaricen con Para la Fortaleza de la Juventud: Una guía para tomar decisiones . Consulten la guía y respondan las preguntas que figuran a continuación:","• ¿Cuáles son sus primeros pensamientos e impresiones?","• ¿Qué preguntas tienen?","• ¿Qué principios (“verdades eternas, invitaciones y bendiciones prometidas”) ha ¿Qué principios (“verdades eternas, invitaciones y bendiciones prometidas”) han visto en su propia vida o en la vida de alguien que conozcan?","• ¿En qué principios les gustaría trabajar? ¿Cómo pondrán en práctica estos principios en su conferencia FSY y cuando se vayan a casa?","• ¿Cómo puede ayudarlos el acercarse más al Salvador?","•"]},{"id":"s131","nivel":2,"titulo":"Relatos y análisis de la guía Para la Fortaleza de la Juventud (15 minutos)","fuente":{"pagina_impresa_inicio":67,"pagina_impresa_fin":68,"pagina_pdf_inicio":71,"pagina_pdf_fin":72},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Ayude a los jóvenes a intercambiar ideas sobre las diferentes decisiones que los jóvenes podrían afrontar hoy en día. Ayúdelos a conversar entre ellos para que elaboren una lista de decisiones. Recuerde que no tienen que ser específicamente decisiones que hayan tomado. Hablar genéricamente los ayudará a mantener la mente abierta mientras intercambian ideas.","Tomen unos minutos para enumerar algunas decisiones (grandes o pequeñas) que los jóvenes afrontan hoy:","Seleccione un par de decisiones de la lista anterior. ¿Cómo podría alguien poner en práctica los principios de la guía Para la Fortaleza de la Juventud para ayudarlo a tomar su decisión? ¿Cómo puede eso ayudarlo a ser un ejemplo para los demás y a acercarse más al Salvador?","El objetivo de esta actividad es ayudar a los jóvenes a idear situaciones hipotéticas que sean relevantes para su vida, dondequiera que se encuentren en el mundo. Aliente a los jóvenes a pensar abiertamente en cuanto al modo de utilizar la guía Para la Fortaleza de la Juventud para tomar decisiones y buscar la ayuda de los cielos a medida que lo hacen. Si les resulta difícil imaginar situaciones hipotéticas, considere utilizar una de las siguientes opciones:","Historia de ejemplo 1 “Recientemente, mi hija de diecisiete años tenía pensado ir a un baile de la escuela. Las amigas con las que iba estaban preparando la ropa que usarían. La mayoría de las chicas de su grupo querían usar un estilo que no era modesto. Mi hija se me acercó y me preguntó: ‘¿Qué debo hacer?’. “Antes de la Conferencia General de octubre de 2022 y la nueva guía Para la Fortaleza de la Juventud , probablemente me habría sentido tentada a darle un sermón que incluyera las palabras: ‘¡No te pondrás ese vestido, de ninguna manera!’. Sin embargo, teniendo en cuenta el mensaje del élder Dieter F. Uchtdorf, le pregunté: ‘Bueno, ¿tú qué piensas?’. Se escuchó un suspiro y me lanzó una mirada que decía: ‘¿Quieres decir que tengo que esforzarme por buscar la respuesta por mi cuenta?’. “En el pasado hemos tenido muchas conversaciones sobre el tema de la modestia, por lo que este tema ha estado en su mente durante mucho tiempo. Le hice más preguntas: ‘¿Qué sabes sobre los principios de la guía? ¿Qué significa que tu cuerpo es sagrado? ¿Qué significa que el Padre Celestial quiere que nos veamos unos a otros por quiénes somos realmente y no solo por nuestro cuerpo físico? ¿Qué podemos aprender de las Escrituras y de las preguntas de la recomendación para el templo que figuran en la guía? ¿A dónde más puedes recurrir para averiguar lo que Dios quiere que hagas?’. “Al día siguiente, le pregunté si había tomado alguna decisión al respecto, y respondió que sentía que se estaba preocupando demasiado por algo poco importante. Ella dijo: ‘Me pregunto si algo tan poco importante le importa al Señor’. Le aseguré que sí le importa y le pregunté: ‘¿Has orado al respecto?’”.","Historia de ejemplo 2 “Mi hijo regresó a casa de la escuela a principios de octubre y dijo que sus amigos le dijeron que el élder Uchtdorf anunció en la conferencia que ahora los tatuajes están bien. Me dijo: ‘Papá, quiero hacerme uno’. Mi primera reacción fue responderle: ‘Sobre mi cadáver’. En lugar de eso, le pregunté: ‘¿Acaso escuchaste el discurso del élder Uchtdorf?’. Sabía que no lo había hecho, porque solo había escuchado las sesiones del domingo. Le pregunté: ‘¿Has leído la nueva guía Para la Fortaleza de la Juventud ?’. Yo sabía que tampoco lo había hecho. Le dije que una vez que lo hiciera, podríamos volver a conversar al respecto. “Unos días más tarde, se me acercó y me dijo que había leído el mensaje y la guía. Le pregunté: ‘¿Anunció el élder Uchtdorf que los tatuajes están bien?’. Me respondió: ‘No. De hecho, el Señor no dice: “Haz lo que quieras”’. Le pregunté: ‘¿Dice la guía que los tatuajes están bien?’. Me contestó: ‘Dice que se supone que debemos honrar la santidad de nuestro cuerpo, incluso cuando eso signifique ser diferentes del resto del mundo. Dice que debemos tomar decisiones sabias, especialmente, cuando pueden tener efectos duraderos en nuestro cuerpo. Pero, papá, no dice que no podamos’. “Respondí: ‘Tampoco dice que no podamos robar un banco, pero eso no lo convierte en una decisión inteligente. ¿Qué te llama tu discipulado a hacer? Tú sabes cuál es mi opinión. ¿Tal vez sea hora de preguntar qué opina nuestro Padre Celestial al respecto?’”."]},{"id":"s132","nivel":2,"titulo":"Cierre (5 minutos)","fuente":{"pagina_impresa_inicio":68,"pagina_impresa_fin":68,"pagina_pdf_inicio":72,"pagina_pdf_fin":72},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Termine el análisis y luego vayan a almorzar como compañía."]},{"id":"s133","nivel":1,"titulo":"Recuento de personas a la hora del almuerzo (Reunión con la compañía)","fuente":{"pagina_impresa_inicio":68,"pagina_impresa_fin":68,"pagina_pdf_inicio":72,"pagina_pdf_fin":72},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Lleve a cabo el recuento de personas después del almuerzo en la ubicación predeterminada de su compañía. Dé los anuncios necesarios."]},{"id":"s134","nivel":1,"titulo":"Actividad Vivir el Evangelio","fuente":{"pagina_impresa_inicio":69,"pagina_impresa_fin":69,"pagina_pdf_inicio":73,"pagina_pdf_fin":73},"tipo_contenido":"texto_extraido_del_manual","parrafos":[]},{"id":"s135","nivel":2,"titulo":"Responsabilidades","fuente":{"pagina_impresa_inicio":69,"pagina_impresa_fin":69,"pagina_pdf_inicio":73,"pagina_pdf_fin":73},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Dirigir una actividad interesante en la que los jóvenes elijan y realicen tareas que sean significativas para ellos. Ayudar a los jóvenes a entender cómo se relacionan esas actividades con la ministración y cómo el ministrar se relaciona con el llamado a recoger a Israel. Ayudar a los jóvenes a sentir entusiasmo por la ministración y a entender que puede ser algo entretenido y gratificante.","Recoger a Israel por medio de la obra de historia familiar En el devocional mundial para los jóvenes del presidente Nelson titulado “Juventud de Israel” (junio de 2018), él invitó a cada mujer y hombre joven de la Iglesia a “que se alisten en el batallón de jóvenes del Señor para ayudar a recoger a Israel”. Fue una amonestación pura y sincera a unirse al Señor en Su obra.","El objetivo de esta actividad es ayudar a los jóvenes a sentirse inspirados a responder a la invitación de recoger a Israel a medida que:","• Comparten el amor de Cristo con las personas con las que se encuentran a diario.","• Son más conscientes de las necesidades de los demás.","• Hacen planes para mejorar la forma en que ministran. Preparación","• Estudie con espíritu de oración el devocional mundial para los jóvenes del presidente Russell M. Nelson titulado “Juventud de Israel” (junio de 2018).","• Lleve el estandarte de la compañía que se elaboró durante la Noche de juegos, lo va a necesitar.","• Familiarícese con el juego que se utiliza en esta actividad (“La masa”) y prepárese para dirigir un análisis significativo.","• Hable con su(s) consejero(s) adjunto(s) sobre la forma en que pueden ayudar a los jóvenes a sacar el máximo provecho de esta actividad.","◦ Conversen con antelación sobre cómo dividir la compañía para las rotaciones (un grupo con cada consejero). Los grupos deben incluir una combinación aleatoria de ambos sexos y de jóvenes de los grupos de cada consejero.","Familiarícese con el tiempo indicado y cíñase a él.","◦ Asegúrese de rotar luego del tiempo indicado en el cuadro que aparece a continuación.","Deje siempre al menos uno o dos minutos para concluir la actividad."]},{"id":"s136","nivel":2,"titulo":"Formato de la actividad Vivir el Evangelio","fuente":{"pagina_impresa_inicio":70,"pagina_impresa_fin":70,"pagina_pdf_inicio":74,"pagina_pdf_fin":74},"tipo_contenido":"texto_extraido_del_manual","parrafos":["ACTIVIDAD DURACIÓN Introducción/División en rotaciones 11:15–11:25 h Primera parte del descubrimiento: Actividad de equipo 11:25–11:45 h Juego: La masa 11:45–12:05 h Segunda parte del descubrimiento: Activi- 12:05–12:25 h dad individual Plan de desarrollo personal Conclusión 12:25–12:30 h Introducción (10 minutos) Los consejeros deben explicar brevemente a su compañía que el propósito de esta actividad es descubrir nuevas maneras de seguir el llamado del presidente Nelson a recoger a Israel por medio de la obra de historia familiar. Para presentar brevemente la actividad, lea la primera cita del manual para el participante y repase el objetivo que aparece en dicho manual. Conceda a los jóvenes unos minutos para que puedan llenar el árbol genealógico proporcionado tanto como puedan. Cuando terminen, dirija un análisis de entre uno y dos minutos basado en las preguntas siguientes:","• ¿Cuánto saben sobre su historia familiar?","• ¿Cómo se sienten en cuanto a lo mucho que saben o en cuanto a lo que ignoran de su historia familiar?","• ¿Por qué sería importante saber acerca de su historia familiar y cómo se relaciona con el recogimiento de Israel?","Repase brevemente las instrucciones de la actividad que aparecen en el manual para el participante y responda cualquier pregunta que los jóvenes puedan tener acerca de la actividad.","Divida su compañía en grupos según lo planeado anteriormente (un grupo por consejero). Cada consejero enseña la primera y la segunda parte en orden. La compañía se reúne entre la primera y la segunda parte para jugar el juego y, cuando terminan, los grupos se rotan para quedar con el consejero con el que no estuvieron durante la primera parte."]},{"id":"s137","nivel":2,"titulo":"Primera parte del descubrimiento: Relata tu historia","fuente":{"pagina_impresa_inicio":70,"pagina_impresa_fin":71,"pagina_pdf_inicio":74,"pagina_pdf_fin":75},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Actividad en grupo (15 minutos) Cada consejero divide su grupo en equipos de cuatro o cinco personas. Cada equipo escoge actividades de la lista del manual que sean significativas para uno o más miembros del equipo. Cada vez que un equipo termine una actividad, se enviará un representante al consejero para que la firme como completada. Los equipos tendrán quince minutos para completar tantas actividades significativas como sea posible. Si hay actividades individuales que no sean idóneas para algunos participantes (por ejemplo, si un participante no tiene un teléfono, tiene familiares que no estén disponibles, etc.), invítelos a elegir otra actividad que puedan realizar durante ese tiempo.","Nota: Si hay alguna pregunta en cuanto a si algo cumple los requisitos de la actividad, puede ser flexible a la hora de aprobar las actividades si siente que los jóvenes están logrando el objetivo de la actividad. Recuerde que la prioridad es alentar a los jóvenes a participar y experimentar un sentido de conexión y de logro, en lugar de centrarse en la cantidad de actividades que se realizan.","Primera parte del descubrimiento: Conclusión de la actividad (5 minutos) Pida a un representante de cada equipo que hable a toda la compañía sobre la actividad favorita de su equipo y que explique la razón."]},{"id":"s138","nivel":2,"titulo":"Juego","fuente":{"pagina_impresa_inicio":71,"pagina_impresa_fin":72,"pagina_pdf_inicio":75,"pagina_pdf_fin":76},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Reúna a la compañía para llevar a cabo el siguiente juego.","La masa (15 minutos) Establezca límites razonables para el juego. Considere pararse en los límites para que estén claramente indicados. Asigne a una o dos personas para que sean los “perseguidores”; cada uno de ellos tiene la meta de formar su propio grupo o “masa” al tocar suavemente a otros jugadores. Cada persona tocada por alguien se integra a la masa de esa persona entrelazando los brazos o tomándose de la mano y juntos intentan tocar a otras personas. Los jugadores deben unirse a la masa si son tocados por cualquier miembro de ella. Cuando la masa tenga seis personas, se divide a la mitad, y produce dos nuevas masas. Tan pronto como todos los jugadores hayan sido tocados, las masas corren a entrelazar los brazos con un consejero designado para formar una megamasa. Dos miembros de la última masa en unirse a la megamasa serán los “perseguidores” durante la próxima ronda.","Jueguen algunas rondas de este juego con las variaciones siguientes:","• Cambie el número de “perseguidores”.","• Cambie el número de personas que puede ser parte de una masa antes de que esta se divida.","• Escoja no hacer divisiones para formar masas más pequeñas. En esta versión, los jugadores acabarán formando una o dos masas grandes y, una vez que su masa tenga cuatro miembros, deben caminar rápido (no correr) para evitar que pisen a alguien.","Recuerde a los jóvenes que deben estar atentos a su entorno para evitar chocar unos con otros.","Nota: Asegúrese de reservar unos minutos para hacer un análisis de este juego. Haga preguntas que ayuden a los jóvenes a hacer conexiones entre el juego y la obra de historia familiar.","Conclusión y rotación (5 minutos) Pida a los jóvenes que hablen con un compañero de lo que lograron durante este segmento de la actividad. Recuérdeles que cada vez que edifican a otra persona y la acercan más a Cristo, están ayudando a recoger a Israel."]},{"id":"s139","nivel":2,"titulo":"Segunda parte del descubrimiento: Descubre y registra tu historia","fuente":{"pagina_impresa_inicio":72,"pagina_impresa_fin":73,"pagina_pdf_inicio":76,"pagina_pdf_fin":77},"tipo_contenido":"texto_extraido_del_manual","parrafos":["En la segunda parte, cada consejero trabajará con un grupo de jóvenes diferente al de la primera parte.","Actividad individual (10 minutos) Antes de comenzar, coloque el estandarte de su compañía en un lugar central, entre los grupos. Dé las siguientes instrucciones:","• Los jóvenes tendrán diez minutos para completar de manera individual una o más actividades del manual que sean significativas para ellos en lo personal.","• Aunque las opciones de la actividad son amplias, el propósito es que cada joven se conecte de manera sincera con su legado. Invítelos a pensar más allá de lo que harían normalmente (por ejemplo, escribir una carta de agradecimiento a un familiar al que no le den las gracias con mucha frecuencia).","• Cada vez que los jóvenes hayan completado una actividad, pueden dibujar un corazón en la parte de atrás del estandarte para representar una vida que ha sido bendecida por la compañía. A medida que cada persona agregue su primer corazón, también debe escribir su nombre como recordatorio de que la compañía se une para alistarse en el batallón de jóvenes.","Si hay actividades individuales que no sean idóneas para algunos participantes (por ejemplo, si un participante no tiene un teléfono, tiene familiares que no estén disponibles, etc.), invítelos a elegir otra actividad que puedan realizar durante ese tiempo.","Nota: Si hay alguna pregunta en cuanto a si algo cumple los requisitos de la actividad, puede ser flexible a la hora de aprobar las actividades si siente que los jóvenes están logrando el objetivo de la actividad. Recuerde que la prioridad es alentar a los jóvenes a participar y experimentar un sentido de conexión y de logro, en lugar de centrarse en la cantidad de actividades que se realizan.","Plan de desarrollo individual (5 minutos) Anuncie brevemente que es hora de que los jóvenes comiencen a trabajar en su plan individual. Conceda a los jóvenes cinco minutos para que contesten las preguntas de sus manuales y elaboren un plan individual a fin de continuar con su obra de historia familiar cuando regresen a casa. Ayúdelos a entender que en la primera pregunta se les pide que se fijen una meta general, mientras que en la segunda se les pide pasos específicos para alcanzar esa meta.","Segunda parte del descubrimiento: Conclusión de la actividad (5 minutos) Pida a los jóvenes que compartan con un compañero lo que lograron durante este segmento de la actividad o lo que han planeado hacer cuando regresen a casa. Recuérdeles que cada vez que hacen algo para ayudar a alguien de cualquier lado del velo a acercarse más a Cristo, están ayudando a recoger a Israel.","Conclusión de la compañía (5 minutos) Reúna a su compañía para tener un breve análisis. Levante el estandarte a fin de mostrar los nombres de los jóvenes y recordarles lo que significa unirse para recoger a Israel. Los consejeros pueden expresar testimonios breves acerca de seguir la invitación del profeta de recoger a Israel. Concluyan con una oración."]},{"id":"s140","nivel":1,"titulo":"Presentación de diapositivas","fuente":{"pagina_impresa_inicio":73,"pagina_impresa_fin":73,"pagina_pdf_inicio":77,"pagina_pdf_fin":77},"tipo_contenido":"texto_extraido_del_manual","parrafos":[]},{"id":"s141","nivel":2,"titulo":"Preparación durante la semana","fuente":{"pagina_impresa_inicio":73,"pagina_impresa_fin":73,"pagina_pdf_inicio":77,"pagina_pdf_fin":77},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Tome fotografías de sus jóvenes durante las actividades de la conferencia y envíelas al coordinador auxiliar asignado a la presentación de diapositivas. Los jóvenes podrían sentirse decepcionados si no se ven a sí mismos ni a otros miembros de su compañía en la presentación de diapositivas.","Nota: algunas sesiones pueden tener un equipo de multimedia asignado que tomará las fotografías necesarias para que usted no tenga que hacerlo."]},{"id":"s142","nivel":1,"titulo":"Toma de fotografías","fuente":{"pagina_impresa_inicio":73,"pagina_impresa_fin":73,"pagina_pdf_inicio":77,"pagina_pdf_fin":77},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Reúnase con su compañía para permitir que los participantes se tomen fotografías entre ellos y con el grupo. Los participantes que deseen mantenerse en contacto podrán intercambiar direcciones."]},{"id":"s143","nivel":1,"titulo":"Mensaje Llévatelo a casa","fuente":{"pagina_impresa_inicio":73,"pagina_impresa_fin":74,"pagina_pdf_inicio":77,"pagina_pdf_fin":78},"tipo_contenido":"texto_extraido_del_manual","parrafos":["El matrimonio director de sesión dirige esta actividad. Siéntese con los jóvenes y anímelos a tomar notas y participar. Prepárese para ayudar a los jóvenes a crear metas en Llévatelo a casa de la compañía, al repasar la “Invitación a hacer y llegar a ser” y “Un modelo de crecimiento” en el Manual para el participante, pág. 18."]},{"id":"s144","nivel":1,"titulo":"Mensaje Llévatelo a casa de la compañía","fuente":{"pagina_impresa_inicio":74,"pagina_impresa_fin":74,"pagina_pdf_inicio":78,"pagina_pdf_fin":78},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Ayude a los jóvenes a hacer lo siguiente:","• Entender que lo que se llevan a casa se refiere a los principios del Evangelio que han aprendido y vivido en la conferencia FSY.","• Establecer metas personales para vivir el Evangelio utilizando la “Invitación a hacer y llegar a ser” de FSY y a centrarse en “Un modelo para el crecimiento”."]},{"id":"s145","nivel":2,"titulo":"Responsabilidades","fuente":{"pagina_impresa_inicio":74,"pagina_impresa_fin":74,"pagina_pdf_inicio":78,"pagina_pdf_fin":78},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Analizar lo que significa llevárselo a casa.","• Repasar la “Invitación a hacer y llegar a ser” que extendió el matrimonio director de sesión.","• Enseñar a los jóvenes que a medida que pongan en práctica de manera constante lo que han aprendido en FSY, sus metas llegarán a ser más significativas y tendrán mayor importancia.","• Reforzar los principios de fijar metas que se enseñan en “Un modelo para el crecimiento”.","• Facilitar un análisis que permita a los jóvenes fijar y compartir metas. SEGMENTO DURACIÓN Análisis de Llévatelo a casa de la compañía 21:00–21:10 h Establecimiento de metas 21:10–21:15 h Compartir las metas 21:15–21:25 h Conclusión 21:25–21:30 h"]},{"id":"s146","nivel":2,"titulo":"Formato de Llévatelo a casa de la compañía","fuente":{"pagina_impresa_inicio":74,"pagina_impresa_fin":75,"pagina_pdf_inicio":78,"pagina_pdf_fin":79},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Análisis (10 min)","• Analicen los principios que compartió el matrimonio director de sesión en el mensaje Llévatelo a casa, junto con la “Invitación a hacer y llegar a ser”. Ayude a los jóvenes a ver cómo pueden poner en práctica esos principios en casa. Ayúdelos a entender que poner en práctica los principios del Evangelio a lo largo de su vida los ayudará a llegar a ser más semejantes al Salvador.","• Repase “Un modelo para el crecimiento” con los participantes. Ayúdelos a darse cuenta de que fijar y lograr metas los ayudará a encontrar equilibrio en su vida. Este modelo de vida los arraigará en el Evangelio y los ayudará a continuar haciendo y guardando convenios sagrados y a alcanzar la gloria celestial. Establecimiento de metas (5 minutos)","• Haga hincapié en la importancia de utilizar “Un modelo para el crecimiento” para fijar metas:","◦ Descubrir en qué tienen que trabajar.","◦ Planificar cómo lo harán.","◦ Actuar en su plan con fe.","◦ Reflexionar en lo que han aprendido.","◦ Celebrar lo que han logrado.","• Conceda tiempo a los jóvenes para que mediten y escriban metas personales que les gustaría lograr cuando regresen a casa. Anímelos a repasar sus notas diarias de Reflexiona y repasa para ayudarlos a pensar en metas. También pueden valorar las invitaciones que se ofrecen en la “Invitación a hacer y llegar a ser”. Compartir las metas (10 minutos) Dé a los jóvenes la oportunidad de compartir sus metas y permítales explicar cómo las lograrán. Los jóvenes pueden tener una poderosa influencia los unos en los otros a medida que aprenden juntos y fortalecen su determinación de lograr sus metas. Recuerde a los jóvenes lo que deben y no deben hacer.","DEBEN","• Compartir metas que los edifiquen mutuamente.","• Ser breves en sus comentarios para que los demás tengan tiempo de compartir.","• Mostrar su apoyo a los demás cuando compartan sus metas.","• Utilizar este tiempo para centrarse en lo que harán cuando regresen a casa. NO DEBEN","• Compartir metas que sean demasiado personales o que tengan que ver con pecados graves.","• Criticar las metas de los demás.","• Utilizar ese tiempo para hablar de amigos o familiares. Conclusión (5 minutos) Para concluir esta actividad, únase a sus consejeros adjuntos y comparta brevemente su testimonio con los jóvenes. Dé el ejempl
