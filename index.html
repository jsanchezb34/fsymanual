<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4f5c">
<title>FSY 2027 — Manual Interactivo para consejeros</title>
<style>
:root{
  --ink:#12323a; --ink-soft:#44606a;
  --teal:#0b4f5c; --teal-2:#0f6b7c;
  --sky:#dcf0f7; --sky-2:#4fb3d9;
  --mint:#e6f3ea; --mint-2:#8cc7a1;
  --sun:#f2a516; --sun-text:#ffc84a; --sun-soft:#fff2d2; --orange:#c75b0d;
  --paper:#fbfdfd; --gray:#eef2f3; --line:#cfdadd;
  --d0:#1c4e80; --d1:#0f7d93; --d2:#4f9a36; --d3:#d94768; --d4:#cc650b; --d5:#8a2a5c; --d6:#7d868c;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --nav-h:3.5rem;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:4.5rem}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.5 var(--sans);
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 1rem)}
h1,h2,h3,h4{line-height:1.2;margin:0}
a{color:var(--teal-2)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:.5rem;top:-4rem;background:var(--sun);color:#000;padding:.6rem 1rem;z-index:50;border-radius:6px}
.skip:focus{top:.5rem}

/* Cabecera */
.top{position:sticky;top:0;z-index:20;background:var(--teal);color:#fff;
  padding:env(safe-area-inset-top,0px) 1rem 0;border-bottom:3px solid var(--sun)}
.brand{display:flex;align-items:center;gap:.7rem;padding:.55rem 0;color:#fff;text-decoration:none;max-width:720px;margin:0 auto}
.brand-mark{background:#fff;color:var(--teal);font-weight:800;letter-spacing:.02em;border-radius:8px;padding:.25rem .5rem;font-size:.95rem}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text span{font-size:.8rem;opacity:.9}

main{max-width:720px;margin:0 auto;padding:1rem;outline:none}

/* Navegación inferior */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;min-height:var(--nav-h);
  font-size:.75rem;color:var(--ink-soft);text-decoration:none}
.bottom a span{font-size:1.25rem;line-height:1}
.bottom a[aria-current="page"]{color:var(--teal);font-weight:700;box-shadow:inset 0 3px 0 var(--sun)}

/* Portada */
.hero{background:var(--teal);color:#fff;border-radius:14px;padding:1.6rem 1.3rem 1.4rem;margin-bottom:1rem;
  background-image:linear-gradient(160deg,var(--teal) 55%,var(--teal-2))}
.hero .kicker{margin:0 0 .2rem;font-size:1rem;font-weight:600;color:var(--sky)}
.hero h1{font-size:clamp(2.6rem,12vw,3.8rem);font-weight:800;letter-spacing:-.02em}
.hero .lema{font-family:var(--serif);font-style:italic;font-size:clamp(1.35rem,6vw,1.8rem);margin:.5rem 0 0}
.hero .ref{margin:.1rem 0 .9rem;color:var(--sun-text);font-weight:600}
.hero .sub{margin:0;font-size:1.05rem}
.welcome{margin:0 0 1.2rem;padding:.8rem 1rem;background:var(--mint);border-left:4px solid var(--mint-2);border-radius:0 8px 8px 0}
.welcome small{display:block;margin-top:.3rem;color:var(--ink-soft)}

.notice{background:var(--sun-soft);border:1px solid #efcf85;border-radius:10px;padding:.7rem .9rem;margin:0 0 1rem;font-size:.92rem}
.notice strong{display:block}

/* Selector de días */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:.35rem;margin:0 0 .5rem;padding:0;list-style:none}
.day-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:3.4rem;width:100%;
  border:2px solid var(--day);border-radius:10px;background:#fff;color:var(--ink);text-decoration:none;line-height:1.05;padding:.3rem 0}
.day-btn small{font-size:.68rem;color:var(--ink-soft)}
.day-btn b{font-size:1.3rem}
.day-btn[aria-current="page"]{background:var(--teal);color:#fff;border-color:var(--day);box-shadow:0 0 0 2px var(--teal)}
.day-btn[aria-current="page"] small{color:#fff}
.day-btn[aria-disabled="true"]{border-style:dashed;border-color:var(--line);color:var(--ink-soft);background:var(--gray);cursor:not-allowed}
.hint{font-size:.88rem;color:var(--ink-soft);margin:.2rem 0 1rem}

/* Encabezado del día */
.day-head{border-left:8px solid var(--day);padding:.2rem 0 .2rem .8rem;margin:.6rem 0 1rem}
.day-head h1{font-size:1.8rem}
.day-head .date{font-size:1.05rem;margin:.15rem 0 0;text-transform:capitalize}
.dress{display:inline-block;margin:.4rem 0 0;padding:.2rem .6rem;border-radius:99px;background:var(--sky);font-weight:600;font-size:.92rem}
.summary{margin:.7rem 0 0;color:var(--ink-soft);font-size:.95rem}
.progress{margin:.8rem 0 0}
.bar{height:.55rem;background:var(--gray);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--mint-2)}
.progress p{margin:.25rem 0 0;font-size:.9rem}

.tools{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1rem}
.btn{min-height:2.75rem;padding:.45rem .9rem;border-radius:10px;border:1.5px solid var(--teal);background:#fff;color:var(--teal);font-weight:600}
.btn:hover{background:var(--sky)}
.btn[aria-pressed="true"]{background:var(--teal);color:#fff}
.btn.primary{background:var(--teal);color:#fff}
.btn.ok[aria-pressed="true"]{background:var(--mint);color:var(--ink);border-color:var(--d2)}

/* Cronograma */
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.7rem}
.act{--accent:var(--day);display:grid;grid-template-columns:4.1rem 1fr;gap:.55rem;align-items:start}
.time{display:flex;flex-direction:column;align-items:flex-end;text-align:right;padding-top:.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
.time b{font-size:1.25rem}
.time span{font-size:.85rem;color:var(--ink-soft)}
.time em{font-style:normal;font-size:.72rem;color:var(--ink-soft);max-width:4rem}
.card{background:#fff;border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:6px 12px 12px 6px;overflow:hidden}
.act-h{margin:0;font-size:1rem}
.act-toggle{display:block;width:100%;text-align:left;border:0;background:none;padding:.75rem .8rem;min-height:3.2rem}
.act-name{display:block;font-weight:700;font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;margin:.35rem 0 0}
.chip{font-size:.78rem;padding:.12rem .5rem;border-radius:99px;background:var(--gray);border:1px solid var(--line)}
.chip.role{background:var(--sky);border-color:#b5dbe8}
.chip.warn{background:var(--sun-soft);border-color:#efcf85}
.chip.done{background:var(--mint);border-color:var(--mint-2)}
.cta{display:flex;align-items:center;gap:.35rem;margin-top:.45rem;color:var(--teal-2);font-weight:600;font-size:.92rem}
.cta i{font-style:normal;display:inline-block;transition:transform .15s}
.act-toggle[aria-expanded="true"] .cta i{transform:rotate(180deg)}
.panel{padding:0 .9rem .9rem;border-top:1px dashed var(--line)}
.panel[hidden]{display:none}
.facts{margin:.8rem 0;padding:0;list-style:none;display:grid;gap:.35rem;font-size:.93rem}
.facts li b{font-weight:600}
.facts .pend{background:var(--sun-soft);border-radius:8px;padding:.45rem .6rem}
.src{font-size:.85rem;color:var(--ink-soft);margin:.8rem 0 0}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin:.9rem 0 0}

/* Texto oficial del manual */
.manual{margin:.9rem 0 0;padding:.2rem 0 .2rem .9rem;border-left:4px solid var(--teal);font-family:var(--serif);font-size:1.04rem;line-height:1.62}
.manual-label{font-family:var(--sans);font-size:.82rem;color:var(--ink-soft);margin:0 0 .4rem}
.manual h4{font-family:var(--sans);font-size:1.02rem;margin:1rem 0 .3rem;color:var(--teal)}
.manual h5{font-family:var(--sans);font-size:.95rem;margin:.8rem 0 .2rem}
.manual p{margin:.45rem 0;max-width:68ch}
.manual ul{margin:.3rem 0 .5rem 1.1rem;padding:0;max-width:68ch}
.manual ul ul{list-style:circle;margin-top:.2rem}
.manual li{margin:.3rem 0}
details.more{margin:.8rem 0 0;border:1px solid var(--line);border-radius:10px;background:var(--gray)}
details.more>summary{cursor:pointer;padding:.65rem .8rem;font-weight:600;min-height:2.75rem;display:flex;align-items:center}
details.more>div{padding:0 .8rem .8rem}

/* Modo estudio */
.study{background:#fff;border:1px solid var(--line);border-top:8px solid var(--day);border-radius:12px;padding:1rem}
.study h1{font-size:1.6rem;margin:.2rem 0}
.study .time-big{font-size:1.1rem;color:var(--ink-soft);margin:0}
.study-nav{display:flex;gap:.5rem;justify-content:space-between;margin:1rem 0}
.study-nav .btn{flex:1}

/* Listas (búsqueda, favoritos, avance) */
.search{display:flex;gap:.5rem;margin:.5rem 0 1rem}
.search input{flex:1;min-height:3rem;padding:0 .8rem;border:2px solid var(--teal);border-radius:10px;font:inherit;background:#fff}
.results{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.results a{display:block;padding:.7rem .85rem;background:#fff;border:1px solid var(--line);border-left:6px solid var(--day);border-radius:6px 12px 12px 6px;text-decoration:none;color:var(--ink)}
.results strong{display:block}
.results small{color:var(--ink-soft)}
.results p{margin:.25rem 0 0;font-size:.92rem;color:var(--ink-soft)}
.empty{padding:1rem;border:2px dashed var(--line);border-radius:12px;color:var(--ink-soft)}
.table-days{width:100%;border-collapse:collapse;font-size:.95rem}
.table-days th,.table-days td{padding:.55rem .4rem;border-bottom:1px solid var(--line);text-align:left}

@media (min-width:700px){
  main{padding:1.5rem 1rem}
  .act{grid-template-columns:5.2rem 1fr}
  .bottom{left:50%;right:auto;transform:translateX(-50%);width:min(720px,100%);border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* Práctica */
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:1rem}
.q{background:#fff;border:1px solid var(--line);border-top:5px solid var(--teal-2);border-radius:12px;padding:.9rem}
.q fieldset{border:0;margin:0;padding:0;min-width:0}
.q legend{font-weight:700;font-size:1.02rem;padding:0;margin-bottom:.5rem}
.qtag{display:block;font-size:.8rem;font-weight:600;color:var(--ink-soft);margin-bottom:.15rem}
.scenario{margin:.2rem 0 .6rem;padding:.6rem .8rem;background:var(--sky);border-radius:8px}
.opts{display:grid;gap:.45rem}
.opt{display:flex;gap:.6rem;align-items:flex-start;padding:.65rem .75rem;border:1.5px solid var(--line);border-radius:10px;min-height:2.9rem;cursor:pointer;background:#fff}
.opt input{margin-top:.2rem;width:1.15rem;height:1.15rem;flex:none}
.opt.is-right{border-color:var(--d2);background:var(--mint)}
.opt.is-wrong{border-color:var(--orange);background:var(--sun-soft)}
.q-actions{margin-top:.7rem;display:flex;gap:.5rem;flex-wrap:wrap}
.q-result{margin-top:.7rem}
.verdict{font-weight:700;margin:.2rem 0}
.q .manual{margin-top:.5rem}
.score{padding:.7rem .9rem;background:var(--mint);border-radius:10px;margin:.2rem 0 1rem}
.subnav{display:flex;gap:.5rem;margin:0 0 1rem;flex-wrap:wrap}

</style>
</head>

rse para partir","partes":["Prepararse para partir"],"modulos_instruccion":[],"instrucciones":[],"sin_instrucciones_propias":true,"notas_mapeo":["La sección del consejero no contiene instrucciones propias para esta fila; solo aparece en la agenda. No se inventan."],"fuente_agenda":{"pagina_impresa":77,"pagina_pdf":81},"estado":"verificado_visualmente_solo_agenda","participacion_consejero":{"vinculo":"misma_hora_inicio","valores":["Dirigen"],"filas_agenda_general":["g6-01"],"fuente":"Agenda recomendada para el personal (impresas 5–11)"}},{"id":"d6-02","dia":6,"orden":2,"hora_original":"7:00–7:30 h","inicio":"7:00","fin":"7:30","nombre_original":"Revisión de las habitaciones al final de la sesión | Salida de los participantes","partes":["Revisión de las habitaciones al final de la sesión","Salida de los participantes"],"modulos_instruccion":["salida"],"instrucciones":[{"seccion_id":"s150","alcance":"propia_del_dia"}],"sin_instrucciones_propias":false,"notas_mapeo":[],"fuente_agenda":{"pagina_impresa":77,"pagina_pdf":81},"estado":"verificado_visualmente_solo_agenda","participacion_consejero":{"vinculo":"misma_hora_inicio","valores":["Dirigen"],"filas_agenda_general":["g6-02"],"fuente":"Agenda recomendada para el personal (impresas 5–11)"}},{"id":"d6-03","dia":6,"orden":3,"hora_original":"7:30–8:30 h","inicio":"7:30","fin":"8:30","nombre_original":"Reunión final del personal","partes":["Reunión final del personal"],"modulos_instruccion":["reunion_final"],"instrucciones":[{"seccion_id":"s151","alcance":"propia_del_dia"},{"seccion_id":"s152","alcance":"propia_del_dia"}],"sin_instrucciones_propias":false,"notas_mapeo":[],"fuente_agenda":{"pagina_impresa":77,"pagina_pdf":81},"estado":"verificado_visualmente_solo_agenda","participacion_consejero":{"vinculo":"misma_hora_inicio","valores":["Asisten"],"filas_agenda_general":["g6-03"],"fuente":"Agenda recomendada para el personal (impresas 5–11)"}}],"secciones":[{"id":"s002","nivel":1,"titulo":"Responsabilidades en las clases","fuente":{"pagina_impresa_inicio":13,"pagina_impresa_fin":13,"pagina_pdf_inicio":17,"pagina_pdf_fin":17},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Si está de servicio en las clases matutinas, recuerde que debe presentarse puntualmente ante el coordinador auxiliar de las clases de la mañana. Si está de servicio en las clases por la tarde, se reunirá con el coordinador auxiliar asignado a la clase al final del almuerzo."]},{"id":"s003","nivel":2,"titulo":"Llevar a cabo la asignación","fuente":{"pagina_impresa_inicio":13,"pagina_impresa_fin":14,"pagina_pdf_inicio":17,"pagina_pdf_fin":18},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Antes de que lleguen los jóvenes","• Preséntese al maestro. Si el maestro no ha llegado a la clase, envíe a un consejero para que hable con el coordinador auxiliar a cargo. No cancele la clase.","• Pregúntele al maestro si prefiere algún himno de apertura.","• Prometa que avisará cuando falten cinco minutos para que termine la clase.","• Pregúntele al maestro cómo le gustaría que lo presentaran o pídale información específica que lo ayude a usted a presentarlo brevemente.","• Si hubiera salones de clases disponibles, asegúrese de que estén debidamente equipados con materiales adecuados, tales como equipo audiovisual, piano, etc. Informe de cualquier inquietud al coordinador auxiliar asignado a la supervisión de las clases.","A medida que llegan los jóvenes","• Indique a los jóvenes que ocupen todos los asientos del frente del salón antes de sentarse atrás y a los lados. Una vez que se llene el salón, pídale a un consejero que dirija a los jóvenes a otras clases.","• Invite a cuatro participantes a ayudar con lo siguiente:","◦ Dirigir el himno de apertura","◦ Tocar el piano (si corresponde)","◦ Ofrecer la primera oración (debe pasar al frente de la clase para ofrecer la primera oración inmediatamente después del himno).","◦ Ofrecer la última oración (debe pasar al frente de la clase para ofrecer la última oración inmediatamente después de la lección).","Inicio de la clase","• Dé la bienvenida a los jóvenes. Invítelos a abrir sus ejemplares de las Escrituras y manuales para tomar apuntes.","• Haga anuncios según sea necesario (por ejemplo, que recojan sus pertenencias después de la última oración, dónde reunirse con su compañía después del almuerzo, etc.).","• Presente al maestro, indique el número y título del himno de apertura y anuncie los participantes que van a ofrecer la primera y la última oración.","• Durante la clase, siéntese entre los jóvenes para ayudarlos a centrar la atención.","• No se ponga de pie ni agregue nada después de que el maestro concluya.","• Si la clase termina temprano, pida a los jóvenes que conversen en voz baja hasta que termine el tiempo de la clase."]},{"id":"s004","nivel":2,"titulo":"Asignación de los consejeros ambulantes/pasillos","fuente":{"pagina_impresa_inicio":14,"pagina_impresa_fin":14,"pagina_pdf_inicio":18,"pagina_pdf_fin":18},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Preséntese en el lugar asignado antes de que lleguen los jóvenes. Es posible que se le asigne permanecer en un puesto específico, o que se le asigne como consejero ambulante para caminar por los pasillos y vigilar a los jóvenes. Ayude a los jóvenes a llegar a clase a tiempo o a elegir otra clase si el salón está lleno.","• Manténgase alerta y atento a su entorno en toda el área que se le haya asignado. Asegúrese de que los jóvenes no deambulen sin supervisión.","• Cuando los jóvenes estén en clases, aproveche la oportunidad de unirse a una clase para que usted pueda ser elevado y edificado mientras esté en su turno. Escuche y aprenda para estar mejor preparado para analizar las clases con los jóvenes en un entorno informal o durante Reflexiona y repasa.","• Durante la clase, siéntese entre los jóvenes para ayudarlos a centrar la atención.","• Regrese a su lugar asignado después de que el maestro haya terminado y antes de que comience la última oración."]},{"id":"s005","nivel":1,"titulo":"Responsabilidades durante el almuerzo, según sea necesario","fuente":{"pagina_impresa_inicio":15,"pagina_impresa_fin":15,"pagina_pdf_inicio":19,"pagina_pdf_fin":19},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Llegue treinta minutos antes para presentarse ante el coordinador auxiliar responsable y para almorzar (si puede en ese momento). Diríjase a la ubicación que se le haya asignado por lo menos diez minutos antes de que terminen las clases. Permanezca durante todo el almuerzo a menos que el miembro del personal asignado a supervisar el almuerzo le indique lo contrario."]},{"id":"s006","nivel":1,"titulo":"Responsabilidades durante el tiempo libre de los participantes","fuente":{"pagina_impresa_inicio":15,"pagina_impresa_fin":15,"pagina_pdf_inicio":19,"pagina_pdf_fin":19},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Preséntese ante el coordinador auxiliar con responsabilidades durante el tiempo libre de los participantes para recibir su ubicación asignada.","Los consejeros con responsabilidades en el tiempo libre de los participantes deben permanecer en sus lugares asignados. Los consejeros se asegurarán de que los jóvenes estén seguros, se comporten de manera apropiada y respetuosa, y no vayan fuera de los límites designados de la propiedad de FSY."]},{"id":"s007","nivel":1,"titulo":"Responsabilidades durante el baile","fuente":{"pagina_impresa_inicio":15,"pagina_impresa_fin":15,"pagina_pdf_inicio":19,"pagina_pdf_fin":19},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Preséntese ante el coordinador auxiliar a cargo antes de la hora asignada para que reciba una responsabilidad específica (entrada, acompañante, mesa del agua u otras ubicaciones)."]},{"id":"s008","nivel":2,"titulo":"Entrada","fuente":{"pagina_impresa_inicio":15,"pagina_impresa_fin":15,"pagina_pdf_inicio":19,"pagina_pdf_fin":19},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Los consejeros que ayudan en la entrada de los jóvenes al baile deben permanecer en la entrada y verificar cuidadosamente todas las pulseras o placas de identificación (si las hubiera). Esto garantizará que solo los participantes de FSY ingresen al baile. No permita que entren a la pista de baile personas que no formen parte de la conferencia. Permanezca en la entrada y continúe supervisando durante todo el baile."]},{"id":"s009","nivel":2,"titulo":"Acompañante","fuente":{"pagina_impresa_inicio":15,"pagina_impresa_fin":15,"pagina_pdf_inicio":19,"pagina_pdf_fin":19},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Ayude a mantener el Espíritu vigilando la pista de baile y haciendo cumplir todas las pautas para los bailes de FSY (véase la pág. 38). Pida amablemente a las personas que no estén cumpliendo las pautas que lo hagan. Procure calmar cualquier desorden. Anime a los jóvenes a hacer participar a otros jóvenes que estén solos y necesiten un amigo. Informe de cualquier problema a un coordinador auxiliar."]},{"id":"s010","nivel":2,"titulo":"Mesa del agua","fuente":{"pagina_impresa_inicio":16,"pagina_impresa_fin":16,"pagina_pdf_inicio":20,"pagina_pdf_fin":20},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Mantenga el suministro de agua en todo momento. Pregunte al coordinador auxiliar a cargo cómo responder si los recipientes de agua están vacíos o si se necesitan más vasos o botellas de agua. Mantenga limpio el lugar donde esté el agua. Procure que las llaves de agua no goteen y asegúrese de tener paños, toallas de papel o un trapeador para limpiar el suelo si se produce un derrame."]},{"id":"s011","nivel":2,"titulo":"Ubicaciones","fuente":{"pagina_impresa_inicio":16,"pagina_impresa_fin":16,"pagina_pdf_inicio":20,"pagina_pdf_fin":20},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Según se le asigne, vigile una estación o área (por ejemplo, baños, entradas y salidas, pasillos, etc.). Evite que los jóvenes se congreguen cerca de los baños u otras áreas. Vigile las entradas y salidas; evite que los jóvenes salgan del baile a menos que lo apruebe un consejero o que entren al baile sin pulsera o placa de identificación (si corresponde), a menos que vayan acompañados de un consejero."]},{"id":"s012","nivel":1,"titulo":"Responsabilidades en el espectáculo de variedades","fuente":{"pagina_impresa_inicio":16,"pagina_impresa_fin":16,"pagina_pdf_inicio":20,"pagina_pdf_fin":20},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Un coordinador auxiliar y otros miembros del personal de FSY (posiblemente consejeros) serán responsables de organizar y dirigir el espectáculo de variedades. Cuando se le asigne esta tarea, reúnase con el coordinador auxiliar responsable para comenzar la planificación.","Ayude a anunciar el espectáculo de variedades durante la sesión, especialmente durante el registro de llegada. Anime a los participantes a presentar sus diversos números y talentos. Dedique el tiempo libre y, en ocasiones, la hora de la cena para efectuar las audiciones de las posibles actuaciones. En el ensayo general y durante el espectáculo, ayude a quienes vayan a actuar y apoye a otros consejeros asignados al espectáculo de variedades, según lo indique el coordinador auxiliar responsable. Se asignará a otros consejeros para que ayuden al personal de escenografía, organicen la utilería, preparen el equipo audiovisual y ayuden durante el espectáculo a quienes vayan a actuar."]},{"id":"s013","nivel":1,"titulo":"Responsabilidades del personal de escenografía del espectáculo de variedades","fuente":{"pagina_impresa_inicio":16,"pagina_impresa_fin":16,"pagina_pdf_inicio":20,"pagina_pdf_fin":20},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Esté presente en el ensayo general que se lleva a cabo justo antes del espectáculo de variedades. El coordinador auxiliar responsable le entregará una lista de los elementos de utilería que se necesitan en cada lugar y momento determinado, y de las presentaciones que requieren equipos audiovisuales. Ayude a los participantes con los elementos de utilería, equipos o apoyo moral que necesiten a medida que ingresen y salgan del escenario. Sea organizado y eficiente para efectuar transiciones breves entre las actuaciones."]},{"id":"s014","nivel":1,"titulo":"Responsabilidades en el programa musical","fuente":{"pagina_impresa_inicio":17,"pagina_impresa_fin":17,"pagina_pdf_inicio":21,"pagina_pdf_fin":21},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Un coordinador auxiliar y otros miembros del personal de FSY (posiblemente consejeros) llevarán a cabo los ensayos, prepararán y dirigirán el programa musical. Cuando se le asigne esta tarea, reúnase con el coordinador auxiliar responsable para comenzar a planificar y se le asignen tareas específicas, tales como prepararse para los ensayos, ayudar a los solistas y lectores y dirigir la música. También ayudará a anunciar y hacer promoción de la participación en el programa musical en el momento del registro de llegada y durante la semana, si es necesario, apoyando y ayudando al coordinador auxiliar en todo lo que pueda.","El día de la presentación, los jóvenes que participen en el programa musical deben darse prisa al cenar. (Sitúese al frente de la fila para cenar si es necesario, pero no lo haga por delante de las personas que no participen en FSY, si corresponde). Reúnanse en el lugar donde se llevará a cabo el programa musical, para el análisis sobre la reverencia y el testimonio (véase pág. 80), que los consejeros asignados al programa musical dirigirán."]},{"id":"s015","nivel":1,"titulo":"Responsabilidades durante la reunión de testimonios","fuente":{"pagina_impresa_inicio":17,"pagina_impresa_fin":17,"pagina_pdf_inicio":21,"pagina_pdf_fin":21},"tipo_contenido":"texto_extraido_del_manual","parrafos":[]},{"id":"s016","nivel":2,"titulo":"Consejero asignado para dirigir","fuente":{"pagina_impresa_inicio":17,"pagina_impresa_fin":17,"pagina_pdf_inicio":21,"pagina_pdf_fin":21},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Elija un himno de apertura y pida a dos participantes que ofrezcan la primera y la última oración.","• Reserve asientos cerca del frente para aquellos que están esperando para dar su testimonio.","• Comiencen con un himno y una oración. Comience dando la bienvenida a todos los participantes y anuncie el himno y la oración.","• Invite a todos los que quieran dar su testimonio a que lo hagan y recuérdeles a qué hora terminará la reunión de testimonios.","• Diga a los jóvenes que aquellos que no alcancen a compartir su testimonio lo pueden hacer con el grupo de su consejero durante Reflexiona y repasa.","• Pida a los jóvenes que permanezcan reverentes si pasa mucho tiempo entre un testimonio y otro. Tal vez deseen leer las Escrituras, continuar escribiendo su testimonio, o anotar sus sentimientos e impresiones en su Manual para el participante de FSY.","• No alargue el horario de la reunión de testimonios. Fíjese en el número de jóvenes que estén esperando para dar su testimonio y en la hora. Tendrá que decidir si debe anunciar con amabilidad, y cuándo hacerlo, que no hay tiempo para más jóvenes aparte de los que ya hayan pasado al frente para dar su testimonio.","• Termine con una oración final y permita que las compañías se retiren, alentando a todos a mantener la reverencia al dejar el salón."]},{"id":"s017","nivel":1,"titulo":"Recorrido por las instalaciones y el recinto","fuente":{"pagina_impresa_inicio":18,"pagina_impresa_fin":18,"pagina_pdf_inicio":22,"pagina_pdf_fin":22},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Familiarícese con las instalaciones y el recinto para saber a dónde dirigir a los participantes durante la sesión. Todo el personal de FSY que trabaje en cualquier lugar por primera vez deberá familiarizarse con las instalaciones recorriendo las zonas donde se llevarán a cabo las actividades. Esto debe incluir las instalaciones reservadas, el alojamiento, el comedor, los campos y las zonas de tiempo libre."]},{"id":"s018","nivel":1,"titulo":"Orientación para el consejero","fuente":{"pagina_impresa_inicio":18,"pagina_impresa_fin":18,"pagina_pdf_inicio":22,"pagina_pdf_fin":22},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Aprenda sobre su función y sus responsabilidades como consejero de la conferencia FSY. Sea puntual y tome notas."]},{"id":"s019","nivel":1,"titulo":"Mensaje del matrimonio director de sesión","fuente":{"pagina_impresa_inicio":18,"pagina_impresa_fin":18,"pagina_pdf_inicio":22,"pagina_pdf_fin":22},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Reciba enriquecimiento espiritual en preparación para la sesión de FSY. Esta es una reunión obligatoria para todo el personal de la conferencia FSY. Tenga a bien vestirse con ropa de domingo, ser puntual y tomar notas."]},{"id":"s020","nivel":1,"titulo":"Sesión de grupo de coordinadores auxiliares/ consejeros","fuente":{"pagina_impresa_inicio":19,"pagina_impresa_fin":19,"pagina_pdf_inicio":23,"pagina_pdf_fin":23},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Establezca conexiones y relaciones personales con otros consejeros y con los coordinadores auxiliares asignados. Los coordinadores auxiliares se reunirán con los consejeros a quienes supervisen durante la semana. Los coordinadores auxiliares definirán las expectativas de la conferencia FSY, ayudarán a los consejeros a fijar metas para la semana y responderán preguntas."]},{"id":"s021","nivel":1,"titulo":"Entrevistas y planificación con los consejeros","fuente":{"pagina_impresa_inicio":19,"pagina_impresa_fin":20,"pagina_pdf_inicio":23,"pagina_pdf_fin":24},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Reciba asignaciones del grupo de consejeros y de la compañía, conozca a su(s) consejero(s) adjunto(s), determine la ubicación del lugar de su compañía y establezca metas para la semana. Los puntos siguientes pueden guiarlo en su planificación:","• Preséntense e intercambien los números de teléfono, si corresponde. Prueben una de las siguientes actividades o una similar para conocerse mejor:","◦ Decir lo que les gusta en sesenta: Enumeren las cosas que les gustan durante sesenta segundos sin parar.","◦ Mostrar y contar: Por turnos, compartan tres fotografías que tengan en su teléfono y que ayuden a describirlos.","◦ Igual/Diferente: Encuentren tres cosas que sean similares y tres cosas que sean diferentes entre usted y su(s) consejero(s) adjunto(s).","• Fijen algunas metas como consejeros adjuntos.","• Analicen cómo pueden asegurarse de llegar a tiempo a todas las actividades.","• Analicen su estilo de enseñanza individual y cómo pueden enseñar juntos de manera eficaz.","• Analicen cómo pueden apoyarse unos a otros. Analicen los estilos de comunicación y la mejor manera de recibir comentarios y sugerencias.","• Analicen cómo pueden elevar y edificar a los jóvenes.","• Determinen quién dirigirá las siguientes actividades, análisis y reuniones:","◦ Nombre de la compañía y pasaje de las Escrituras durante Reúnete con tu compañía","◦ Establecimiento de metas durante la noche de hogar","◦ Estudio del Evangelio cada día","◦ Análisis sobre la reverencia y el testimonio","◦ Llévatelo a casa de la compañía del Día 5","• Determinen un punto de reunión de la compañía al cual todos los jóvenes de su compañía puedan tener acceso y lo encuentren. Este lugar se utilizará para ciertas actividades como Reúnete con tu compañía, Estudio del Evangelio y Llévatelo a casa de la compañía, entre otras. Analicen si su grupo necesita un segundo lugar de la compañía para reunirse para realizar actividades, comidas o bailes."]},{"id":"s022","nivel":1,"titulo":"Reunión del personal","fuente":{"pagina_impresa_inicio":22,"pagina_impresa_fin":22,"pagina_pdf_inicio":26,"pagina_pdf_fin":26},"tipo_contenido":"texto_extraido_del_manual","parrafos":["En esta última reunión del personal antes de que comience la sesión, llegue a tiempo y preste atención a cualquier cambio en la agenda, información específica de la sesión y otros anuncios. ¡Esperamos que se sienta animado y entusiasmado por esta conferencia!"]},{"id":"s023","nivel":1,"titulo":"Planificación con los consejeros adjuntos","fuente":{"pagina_impresa_inicio":22,"pagina_impresa_fin":23,"pagina_pdf_inicio":26,"pagina_pdf_fin":27},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Planifique y analice cómo llevará a cabo las siguientes actividades y asignaciones.","• Diariamente — Recuento de personas durante el almuerzo","• Día 1 — Reúnete con tu compañía","◦ Juegos para conocerse.","◦ Nombre de la compañía y aplicación de las Escrituras.","◦ Verso cantado de la compañía: un canto sencillo para unir a su compañía y ayudarlos a recordar su nombre. Por ejemplo, si el nombre de su compañía fuera “Gozo en el trayecto”, el canto podría ser “¡Gozo! ¡Gozo! ¡Gozo! ¡Gozo en el trayecto!”.","• Día 1: Noche de hogar","◦ Juegos y reunión de análisis.","◦ Establecer metas.","• Del Día 2 hasta el Día 4: Estudio del Evangelio","• Día 2: Pautas para los bailes de FSY","• Día 4: Análisis sobre la reverencia y el testimonio","• Día 5","◦ Repaso del establecimiento de metas","◦ Actividad de la guía Para la Fortaleza de la Juventud","◦ Actividad Vivir el Evangelio","◦ Mensaje Llévatelo a casa de la compañía “Además de mostrar a los jóvenes la senda por medio del ejemplo, los guiamos al comprender su corazón y al caminar a su lado en el sendero del Evangelio. Para realmente comprender su corazón, debemos hacer mucho más que solo estar en el mismo cuarto […]. Debemos planificar y aprovechar momentos de enseñanza que generen un impacto profundo y perdurable en su mente y en su corazón.[…] “Para que nuestras interacciones con los jóvenes realmente tengan un efecto en su corazón, tenemos que ponerles atención […]. Lo más importante es hacerles preguntas, dejarlos hablar, y después estar dispuestos a escuchar —sí, escuchar, y luego escuchar más— incluso ¡escuchar con oídos espirituales!”.","Robert D. Hales, “Nuestro deber a Dios: La misión de padres y líderes para con la nueva generación”, Liahona , mayo de 2010, págs. 95, 96"]},{"id":"s024","nivel":1,"titulo":"Distribución de materiales","fuente":{"pagina_impresa_inicio":23,"pagina_impresa_fin":23,"pagina_pdf_inicio":27,"pagina_pdf_fin":27},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Prepárese para que el registro de llegada se realice sin problemas y de manera eficaz.","• Según las indicaciones del coordinador auxiliar responsable, ayude a trasladar los materiales de registro de llegada al lugar de llegada.","• Coloque las tarjetas de identificación y las pulseras, si las hubiere, sobre las mesas.","• Organice las camisetas por talla. (Si es necesario, se pueden extender algunas camisetas sobre una mesa para que sirvan de referencia para aquellos que tal vez no sepan qué talla tienen)."]},{"id":"s025","nivel":1,"titulo":"Audiciones y asignaciones de cantantes (opcional)","fuente":{"pagina_impresa_inicio":23,"pagina_impresa_fin":23,"pagina_pdf_inicio":27,"pagina_pdf_fin":27},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Puede ayudar a invitar al Espíritu por medio de la música durante los devocionales de la conferencia y otras reuniones. Si está interesado en cantar un solo en una de estas reuniones, puede participar en la audición. El coordinador auxiliar asignado como supervisor de cantantes dará los detalles de este proceso.","• Para cantar durante la sesión, debe cantar en una audición algunos compases de una canción de uno de los álbumes del lema para los jóvenes.","• Dígale al coordinador auxiliar asignado como supervisor de cantantes qué canciones del álbum del lema para los jóvenes prefiere cantar y si se siente cómodo cantando un solo, en dúo o en un grupo pequeño.","• A más tardar, en la tarde del Día 1 se le notificará si ha sido seleccionado para cantar, qué canción cantará y cuándo lo hará."]},{"id":"s026","nivel":1,"titulo":"Práctica de baile (opcional)","fuente":{"pagina_impresa_inicio":24,"pagina_impresa_fin":24,"pagina_pdf_inicio":28,"pagina_pdf_fin":28},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Se anima al personal de la conferencia FSY a ayudar a edificar la unidad y llevar entusiasmo a los jóvenes bailando durante la orientación, el registro de llegada y durante toda la semana. Todos los consejeros que hayan aprendido los bailes en fila, o que deseen aprenderlos, pueden participar en la práctica de bailarines. El coordinador auxiliar a cargo de los bailarines proporcionará más información."]},{"id":"s027","nivel":1,"titulo":"Llegada","fuente":{"pagina_impresa_inicio":24,"pagina_impresa_fin":24,"pagina_pdf_inicio":28,"pagina_pdf_fin":28},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Dé la bienvenida, prepare y anime a todos los jóvenes para su experiencia en la conferencia FSY. Durante el proceso de registro de llegada, actúe de forma profesional y cordial. Dé una primera impresión positiva siendo sociable y amigable. Permanezca alerta y dispuesto a servir durante el proceso de registro de llegada.","• Empiece siempre a tiempo.","• Anime a los jóvenes, pero evite el comportamiento bullicioso.","• Responda correctamente las preguntas de los participantes, padres y líderes. Todas las preguntas sobre las inscripciones en el lugar o cambios de dormitorios deben remitirse a los coordinadores, el matrimonio director de sesión o el equipo de logística en la mesa de soluciones. Si tiene cualquier duda sobre la respuesta a una pregunta, remita o acompañe a los participantes a la mesa de soluciones.","• Al repartir los materiales, sea cordial y amable con los jóvenes. Dígale a cada participante adónde debe ir o guíelo a través de la fila de registro de llegada, explicando rápidamente qué es cada objeto.","• No entregue una pulsera u otros materiales a ninguna persona que no esté inscrita en la conferencia FSY. Cuando entregue las tarjetas de identificación de los participantes, verifique el nombre y compruebe con el participante que toda la información indicada sea correcta.","• Después de entregar a los participantes su tarjeta de identificación y cordón, colóqueles una pulsera en la muñeca (si las hay) y explíqueles la importancia de llevarla puesta en todo momento.","• Recuerde a los participantes que marquen sus manuales y que los tengan a la mano durante toda la sesión.","• Las condiciones climáticas o circunstancias especiales pueden afectar al registro de llegada. De ser necesario, un coordinador auxiliar dará instrucciones alternativas.","• Sea flexible y esté dispuesto a brindar ayuda y apoyo adicionales."]},{"id":"s028","nivel":1,"titulo":"Revisión de las habitaciones de los participantes (si corresponde)","fuente":{"pagina_impresa_inicio":25,"pagina_impresa_fin":25,"pagina_pdf_inicio":29,"pagina_pdf_fin":29},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Ayude a los jóvenes a conocerse mientras revisa sus habitaciones o dormitorios en busca de daños que hayan ocurrido antes de que los jóvenes ingresaran a las instalaciones. Aliente a los jóvenes a dejar los dormitorios y todas las zonas que utilicen en mejores condiciones que cuando llegaron.","• Durante las revisiones de las habitaciones, evalúe el estado de los dormitorios de los participantes en busca de daños previos.","• Informe de inmediato a su coordinador auxiliar cuando se haya completado la revisión de las habitaciones e informe de cualquier daño que haya encontrado.","◦ Informe a su coordinador auxiliar sobre los daños que deban repararse de inmediato (por ejemplo, un cabezal de ducha o un grifo rotos, tomacorrientes que no funcionan, etc.).","◦ Indique a los jóvenes que deben comunicar de inmediato cualquier daño que ocurra durante la sesión."]},{"id":"s029","nivel":1,"titulo":"Reúnete con tu consejero","fuente":{"pagina_impresa_inicio":25,"pagina_impresa_fin":25,"pagina_pdf_inicio":29,"pagina_pdf_fin":29},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Conozca a los jóvenes, establezca conexiones y fije expectativas. Reúnete con tu consejero es la primera ocasión en que usted se encuentra con los jóvenes e interactúa con ellos; esta es una oportunidad para ayudarlos a captar la visión de la conferencia FSY, con todas sus oportunidades y experiencias. Analice con claridad las normas, las reglas y las formas en que abordará las dudas, para que sepan lo que se espera de ellos. Recuerde, los jóvenes necesitan que usted sea en primer lugar un líder y mentor, en segundo lugar, un maestro, y en tercer lugar, un amigo. Considere las instrucciones siguientes cuando lleve a cabo la actividad Reúnete con tu consejero."]},{"id":"s030","nivel":2,"titulo":"Establecer un tono de amor y bondad para invitar al Espíritu","fuente":{"pagina_impresa_inicio":26,"pagina_impresa_fin":26,"pagina_pdf_inicio":30,"pagina_pdf_fin":30},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Preséntese y exprese su aprecio y entusiasmo por ser consejero de FSY.","• Pida a los jóvenes que se presenten y digan algo divertido o singular sobre sí mismos.","• Ayude a los jóvenes a comprender el propósito de la conferencia FSY: fortalecer la fe en Jesucristo y en Su Evangelio restaurado, tener un mayor sentido de pertenencia y recibir poder para continuar teniendo experiencias espirituales en el hogar.","• Haga hincapié en fijar y lograr metas personales y de la compañía mediante la participación espiritual y social, la obediencia a las reglas, y la toma de buenas decisiones.","• Anime a los jóvenes a hablar con usted sobre las dudas que surjan durante FSY."]},{"id":"s031","nivel":2,"titulo":"Explicaciones de la lista de verificación","fuente":{"pagina_impresa_inicio":26,"pagina_impresa_fin":28,"pagina_pdf_inicio":30,"pagina_pdf_fin":32},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Después de las presentaciones, pida a los jóvenes que vayan a “Reúnete con tu consejero” (Manual para el participante, pág. 10). Explique cada elemento de la lista de verificación (consulte las instrucciones que se dan a continuación). Cuando esté seguro de que entienden las expectativas, pídales que firmen y pongan la fecha en la parte inferior de la página de su manual.","Acepte y comprométase a respetar la “Conducta en las actividades de la Iglesia”","Explique cada una de las seis reglas que se proporcionan en la sección “Conducta en las actividades de la Iglesia” (Manual para el participante, pág. 4) y asegúrese de que los jóvenes las entiendan todas. La participación en cualquiera de las conductas mencionadas puede resultar en que los jóvenes sean enviados a casa de inmediato. Dígales que todos los delitos, y los incidentes o las bromas de carácter perjudicial o destructivo podrían ser notificadas a las autoridades locales. Las consecuencias derivadas de las medidas tomadas por las autoridades locales son ajenas al control del personal de la conferencia FSY.","Pulsera (si corresponde) ¡Los jóvenes deben llevar puesta su pulsera de FSY en todo momento! Estas indican qué personas forman parte de la sesión y permiten a los participantes acceder a cada actividad, incluidas las comidas y los bailes.","Manual y Guía Para la Fortaleza de la Juventud Los participantes deben escribir su nombre y el nombre de su consejero en su Manual para el participante de FSY. Los participantes deben tener siempre su manual a la mano. Muéstreles dónde están los horarios de cada día. Si a un joven se le asigna un devocional matutino para participantes, indique el día y la página a los que hará referencia. Esos devocionales se centrarán en los principios que se encuentran en Para la Fortaleza de la Juventud: Una guía para tomar decisiones al final del Manual para el participante de FSY.","Respeto y responsabilidad Los jóvenes deben mostrar respeto por sí mismos, por los demás jóvenes, por el personal y por su entorno. No se tolerará la intimidación ( bullying ). Sea cortés, amable y respetuoso con todas las personas. Trate la propiedad y todas las instalaciones con respeto, dejándolo todo mejor que cuando llegó.","• Los jóvenes son responsables de todas sus pertenencias personales y no deben pedirle a los miembros del personal de FSY que les guarden los teléfonos ni que vigilen cualquier otro artículo personal. Las conferencias FSY no se hacen responsables de las pertenencias perdidas, rotas o dañadas de ningún participante.","• Repase las pautas que se encuentran en “Uso responsable de la tecnología” (Manual para el participante, pág. 6). Cada participante tiene edad suficiente para hacerse cargo de su propia tecnología. Todos los jóvenes deben establecer pautas personales que los mantengan seguros cuando usen internet. Los teléfonos celulares deben usarse solo de maneras apropiadas y en momentos apropiados. Se pueden utilizar los teléfonos para consultar las Escrituras y los recursos de estudio del Evangelio. (Nota para los consejeros: Mantengan su teléfono en vibración en todo momento para que otros miembros del personal puedan comunicarse con ustedes según sea necesario).","• Normas de vestir y de arreglo personal: Invite a los jóvenes a meditar y comprometerse a seguir los principios que se enseñan en la sección “Tu cuerpo es sagrado” de la guía Para la Fortaleza de la Juventud (Manual para el participante, págs. 162–169).","• Protocolo en el salón de clases: Mantenga la reverencia y muestre respeto por los presentadores. Durante las clases y los devocionales, espere hasta después de la última oración para recoger sus pertenencias.","• Comportamiento en el recinto y las instalaciones: Sea respetuoso con todas las instalaciones y los dormitorios. No se permite la presencia de los participantes en los dormitorios del sexo opuesto.","Normas de salud y seguridad La salud y la seguridad de los participantes son muy importantes. Pídales que no hagan nada potencialmente perjudicial para sí mismos o para los demás, como compartir medicamentos, trepar a los árboles, hacer volteretas, saltar por las ventanas o las escaleras, etc.","• Acompañamiento de los consejeros. Por la seguridad de los participantes, los jóvenes que deban salir de una actividad para ir al baño, tomar agua o atender una necesidad personal deben informar a su consejero. Luego, los jóvenes pueden atender sus necesidades y volver a informar a su consejero a su regreso. Si los jóvenes deben salir de las inmediaciones, dos miembros del personal deben acompañar al joven o bien un miembro del personal debe acompañar de dos a cuatro jóvenes. Los consejeros no pueden estar a solas con un participante. A los jóvenes les podría resultar incómoda esta norma, pero haga hincapié en que la seguridad de ellos es de máxima prioridad.","• Apagar las luces. Todas las noches, a las 22:30 h, los participantes deben estar en su habitación con las luces apagadas. Asegúrese de que los jóvenes sepan dónde se ubican los dormitorios donde usted duerme para que sepan dónde encontrarlo en caso de emergencia.","• Recuento de personas. Los recuentos de personas se programan regularmente a lo largo del día. Ayude a los participantes a entender lo importante que es que el personal sepa dónde están en todo momento. Como consejero, comprenda y siga los procedimientos de recuento de personas:","◦ Pida a los jóvenes que escriban el lugar y los horarios del recuento de personas en el espacio proporcionado en su manual.","◦ Realice el recuento de personas e informe al coordinador auxiliar cada noche después de que los participantes regresen a los dormitorios, cumpliendo los siguientes requisitos:","a. A los participantes no se les permite salir de su piso o dormitorio, excepto con el permiso de su consejero y acompañados por un miembro del personal y al menos otra persona.","b. Las ventanas de los participantes deben estar cubiertas (si corresponde).","• No deben salir de la conferencia FSY. Por lo general, FSY se realiza dentro de las instalaciones o el recinto donde se lleva a cabo. Pregunte al coordinador auxiliar cuáles son los límites físicos de la sesión. Podría haber medidas disciplinarias por salirse de los límites de la conferencia. Las conferencias FSY podrían tener que asumir la responsabilidad de cualquier daño que sufra algún joven. Los participantes no pueden irse si no siguen las normas establecidas y los procedimientos de salida de su sesión específica.","• La obligación de informar. Explique a los jóvenes que cuando un miembro del personal de la conferencia FSY tiene motivos para creer que un joven (aunque el joven tenga dieciocho años) ha sufrido abuso o maltrato, o se entera de que un joven está siendo sometido a condiciones o circunstancias que razonablemente darían lugar a abusos, el miembro del personal debe comunicar la situación a un coordinador, a las autoridades locales o a ambos, de conformidad con la legislación local.","• Protocolo de emergencias. En caso de emergencia, indique a los jóvenes que informen al miembro del personal de la conferencia FSY más cercano. El personal debe seguir los procedimientos de emergencia establecidos por las leyes locales y por el asesor legal de Área."]},{"id":"s032","nivel":2,"titulo":"¡Participar en la conferencia FSY!","fuente":{"pagina_impresa_inicio":28,"pagina_impresa_fin":29,"pagina_pdf_inicio":32,"pagina_pdf_fin":33},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Devocionales de los participantes. Explique en qué consisten los devocionales de los participantes y asigne a los jóvenes que estén a cargo de los devocionales del Día 2 al Día 5. Se anima a los participantes a enseñar de dos en dos pero pueden hacerlo solos si fuera necesario. El mejor momento para prepararse es durante el tiempo libre y el tiempo para meditar.","• Reflexiona y repasa. Explique brevemente en qué consiste Reflexiona y repasa, para que los jóvenes puedan acudir preparados para compartir sus experiencias y pensamientos.","• Espectáculo de variedades. Invite a los jóvenes a que participen en la audición para el espectáculo de variedades. Pídales que anoten en su manual el lugar donde se llevarán a cabo las audiciones.","• Programa musical. Invite a los jóvenes a participar en el programa musical. Pídales que anoten en su manual el lugar donde se llevarán a cabo los ensayos."]},{"id":"s033","nivel":1,"titulo":"Reúnete con tu compañía","fuente":{"pagina_impresa_inicio":29,"pagina_impresa_fin":29,"pagina_pdf_inicio":33,"pagina_pdf_fin":33},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Cree un ambiente de unidad y cariño entre los jóvenes a medida que se vayan conociendo.","• Durante la conferencia, ayude a los jóvenes a buscar y responder a oportunidades de tender una mano a los demás con amistad, bondad y amor. El hacerlo así invitará al Espíritu y fortalecerá su compañía."]},{"id":"s034","nivel":2,"titulo":"Preparación","fuente":{"pagina_impresa_inicio":29,"pagina_impresa_fin":30,"pagina_pdf_inicio":33,"pagina_pdf_fin":34},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Lea el mensaje de Jeffrey R. Holland, “Estar con ellos y fortalecerlos” ( Liahona , mayo de 2018, pág. 103). Al describir la invitación a ministrar, él enseñó: “Todos necesitamos sentir la mano cálida de la amistad […]. Trabajemos hombro a hombro con el Señor de la viña, dando al Dios y Padre de todos nosotros una mano de ayuda con Su asombrosa tarea de contestar oraciones, dar consuelo, secar lágrimas y fortalecer las rodillas débiles. Si lo hacemos, seremos más como los verdaderos discípulos de Cristo que debemos ser”.","Jeffrey R. Holland, “Estar con ellos y fortalecerlos”, Liahona , mayo de 2018, págs. 102, 103.","Planifique con su(s) consejero(s) adjunto(s) cómo facilitará un análisis con los jóvenes para hacer hincapié en los principios del discurso del élder Holland. El análisis debe ayudarles a reconocer oportunidades de servir y satisfacer las necesidades de las personas que los rodean. Incluya en su análisis el pasaje de las Escrituras, la cita y las ideas que se encuentran en la pág. 12 del Manual para el participante.","Júntese con su compañía en el punto de reunión para que los participantes puedan conocerse.","• A medida que se relacionen y se reúnan, trate de conocer a los jóvenes de los grupos de sus consejeros adjuntos.","• Si esta actividad le resulta incómoda al principio, mantenga una actitud positiva y alentadora. Esté dispuesto a salir de su zona de confort para que los jóvenes se sientan más cómodos participando y siendo ellos mismos.","• Sea proactivo, participe e incluya a todos los jóvenes. Ayúdelos a conocerse, integrarse y conversar entre ellos.","• Observe las necesidades de los jóvenes y sus interacciones para facilitar esta actividad de manera eficaz."]},{"id":"s035","nivel":2,"titulo":"Juegos para conocerse (30 minutos)","fuente":{"pagina_impresa_inicio":30,"pagina_impresa_fin":30,"pagina_pdf_inicio":34,"pagina_pdf_fin":34},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Lleve a cabo algunos juegos para conocerse, dividiendo su compañía en grupos más pequeños y reorganizándolos de vez en cuando para aumentar la variedad y la facilidad de manejo del grupo.","El denominador común Divida la compañía en grupos de tres. Pida a cada grupo que encuentre algo que tengan en común y algo que haga que cada persona sea única; por ejemplo, que todos los del grupo tengan un perro en casa, pero que cada uno tenga un postre favorito diferente.","Tú, yo, izquierda, derecha Pida a la compañía que forme un círculo, con un participante en el centro. Este participante será la “persona que llama”.","Pida a los participantes que se presenten a las personas que se encuentran a su izquierda y a su derecha.","Explique a la compañía que “la persona que llama”, que está en el centro, señalará a alguien del círculo y dirá “Tú”, “Yo”, “Izquierda” o “Derecha”, y contará hasta cinco a un ritmo razonable. “Tú” se refiere a la persona a la que se señala; “yo” se refiere a la persona que llama; “izquierda” se refiere al participante a la izquierda de la persona a la que se señala; y “derecha” se refiere al participante a la derecha de la persona a la que se señala. El participante a quien se señala debe decir correctamente el nombre de la persona que se haya indicado antes de que la persona que llama cuente hasta cinco. Si la persona a la que se señala tiene éxito, la persona que llama señala a otro participante y repite el proceso. Si no lo consigue, se convierte en la nueva persona que llama.","Como consejero, no dude en gritar “cambio” cada cierto número de rondas para indicar que los participantes deben mezclarse y formar un nuevo círculo. También puede incluir a varias personas que llamen a medida que avanza el juego.","Nudo humano Pida a todos los participantes de su compañía que se paren formando un círculo cerrado. Cada participante debe poner ambas manos hacia delante y tomar otras dos manos al azar, lo cual crea un nudo humano enorme. Anime a los jóvenes a que trabajen juntos para desatar el nudo sin soltarse de las manos. Los consejeros no deben participar en el nudo, sino que deben permanecer de pie a un lado y animar a los jóvenes."]},{"id":"s036","nivel":2,"titulo":"Nombre y pasaje de las Escrituras de la compañía (10 minutos)","fuente":{"pagina_impresa_inicio":31,"pagina_impresa_fin":31,"pagina_pdf_inicio":35,"pagina_pdf_fin":35},"tipo_contenido":"texto_extraido_del_manual","parrafos":["El nombre y el pasaje de las Escrituras de su compañía les serán asignados o usted los seleccionará en el Día 0 de la sesión. Tiene un propósito importante, así que incorpórelo a su sesión tanto como le sea posible. El nombre unirá a su compañía y los ayudará a aprender más acerca de su Salvador.","Lean juntos el pasaje de las Escrituras de su compañía y luego anuncie el nombre de su compañía. Analice lo que el nombre de la compañía significa para los jóvenes, utilizando el pasaje de las Escrituras de la compañía para guiar el análisis. Pregúnteles de qué manera el entender este nombre influirá en su experiencia."]},{"id":"s037","nivel":2,"titulo":"Verso cantado de la compañía (5 minutos)","fuente":{"pagina_impresa_inicio":31,"pagina_impresa_fin":31,"pagina_pdf_inicio":35,"pagina_pdf_fin":35},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Enseñe a los jóvenes el verso cantado de su compañía. Lo debería haber creado con su consejero adjunto en la mañana del Día 1 (véanse las instrucciones en la pág. 22).","• Explique que ese verso cantado se podrá utilizar durante toda la conferencia a medida que su compañía concluya diversas actividades."]},{"id":"s038","nivel":1,"titulo":"Orientación","fuente":{"pagina_impresa_inicio":31,"pagina_impresa_fin":31,"pagina_pdf_inicio":35,"pagina_pdf_fin":35},"tipo_contenido":"texto_extraido_del_manual","parrafos":["La orientación tiene por objeto entusiasmar a los jóvenes en cuanto a la semana que tienen por delante. Se les presentará al matrimonio director de sesión, a los coordinadores, a los coordinadores auxiliares y a los coordinadores de bienestar, y recibirán información crucial para las próximas actividades. La orientación debe fomentar la unidad de la compañía y de la sesión.","• Los consejeros deben permanecer de pie y bailar para fomentar el entusiasmo, sin perder de vista a los jóvenes, hasta que los coordinadores se pongan de pie para dar comienzo a la orientación.","• Es una buena idea sentarse en un asiento al lado del pasillo para estar pendiente de los jóvenes que necesitan salir por cualquier motivo, como ir al baño.","• Ayude a los jóvenes a entusiasmarse con FSY. ¡No subestime el poder de su ejemplo! Anime a todos y anímese por todo, y los jóvenes comenzarán a seguir su ejemplo.","• Los consejeros pueden aprender un baile en fila y presentarlo durante la orientación.","Nota: Al sentarse para la orientación (o para cualquier actividad de grupo grande), algunos jóvenes podrían tener que usar el baño. Pídales que se sienten primero, antes de ir al baño, o asegúrese de reservarles un asiento para que puedan seguir sentados con su compañía."]},{"id":"s039","nivel":1,"titulo":"Cena","fuente":{"pagina_impresa_inicio":32,"pagina_impresa_fin":32,"pagina_pdf_inicio":36,"pagina_pdf_fin":36},"tipo_contenido":"texto_extraido_del_manual","parrafos":["La hora de la comida es una gran oportunidad para conocer a los jóvenes y ayudarlos a sentirse cómodos. Durante las comidas, todo el personal debe ayudar a que los jóvenes se comporten correctamente y a que permanezcan en las zonas autorizadas. Sea un buen ejemplo. No fomente ni participe en conductas inapropiadas (bromas relacionadas con la comida, concursos de comida, etc.). Recuerde a los jóvenes que sean respetuosos con otros grupos en el comedor. Dejen limpio el lugar.","• Anime a su compañía a comer juntos para fomentar la unidad. Si los participantes quieren comer con un amigo o familiar en otra compañía, respete su decisión.","• Recuerde a los jóvenes que se desplazarán como compañía a la noche de hogar."]},{"id":"s040","nivel":1,"titulo":"Lección de la noche de hogar","fuente":{"pagina_impresa_inicio":32,"pagina_impresa_fin":32,"pagina_pdf_inicio":36,"pagina_pdf_fin":36},"tipo_contenido":"texto_extraido_del_manual","parrafos":["La noche de hogar puede enseñar la importancia de seguir el consejo profético, reforzar la puesta en práctica de los principios del Evangelio y dar un ejemplo del formato tradicional de la noche de hogar. La noche de hogar es donde se presenta en la conferencia el lema anual para los jóvenes.","Llegue lo suficientemente temprano como para sentarse antes de que comience la noche de hogar. Pida a los jóvenes que saquen su ejemplar de las Escrituras, el Manual para el participante de FSY y un bolígrafo antes de la primera oración. Recuérdeles que no guarden sus materiales hasta después de la última oración. Para fomentar la reverencia, permanezca de pie y preste atención a los jóvenes hasta que los coordinadores se pongan de pie para dar comienzo a la reunión. Siéntese junto a su compañía y escuche al matrimonio director de sesión. Tome notas y prepare posibles preguntas para plantearlas durante Reflexiona y repasa."]},{"id":"s041","nivel":1,"titulo":"Juegos de la noche de hogar y reunión de análisis","fuente":{"pagina_impresa_inicio":32,"pagina_impresa_fin":32,"pagina_pdf_inicio":36,"pagina_pdf_fin":36},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Elija algunos de los siguientes juegos para llevar a cabo con su compañía. Tome de cinco a diez minutos después de cada juego para hacer una reunión de análisis, de manera que los jóvenes puedan relacionar el juego con los principios del Evangelio y cómo se ponen en práctica en la vida cotidiana. No se apresure durante una reunión de análisis, ya que estas conversaciones preparan a los jóvenes para hacer conexiones con el Evangelio a lo largo de la conferencia. Un juego puede ser suficiente."]},{"id":"s042","nivel":2,"titulo":"Reunión de análisis de una actividad","fuente":{"pagina_impresa_inicio":33,"pagina_impresa_fin":33,"pagina_pdf_inicio":37,"pagina_pdf_fin":37},"tipo_contenido":"texto_extraido_del_manual","parrafos":["La reunión de análisis puede ayudar a los jóvenes a relacionar los principios de la actividad con los principios del Evangelio.","• Los juegos pueden crear un ambiente seguro para ayudar a los jóvenes a comprender las maneras de poner en práctica el Evangelio en todos los aspectos de su vida y a establecer conexiones después. Diga a los jóvenes que la reunión de análisis se llevará a cabo después del juego.","• Las habilidades para llevar a cabo una reunión de análisis exitosa son similares a las habilidades referentes a las preguntas eficaces, con algunos principios adicionales. Cierre la brecha entre el juego y la puesta en práctica con preguntas.","◦ ¿Qué aspecto del juego les gustó o no les gustó?","◦ ¿Qué emociones sintieron durante el juego?","◦ ¿Qué desafíos afrontaron?","• Pida al grupo que ponga en práctica las ideas al Evangelio y seleccione a personas específicas que parezcan haberse conmovido más.","◦ ¿Cómo se aplica ese juego al Evangelio?","• Utilice preguntas de seguimiento que conduzcan a una reflexión más profunda.","• Formule preguntas con un propósito y escuche con atención las respuestas.","• Valide todas las respuestas para aumentar la confianza de los participantes. Agradezca a las personas por su nombre y luego haga hincapié en un punto que hayan mencionado o resuma su comentario.","Pídales que se sienten juntos formando un semicírculo de unas cuantas filas, unos detrás de otros; estar cerca los mantiene más centrados. Anímelos a hablar en voz alta y clara. Asegúrese de que todos puedan verse entre sí y escuchar todos los comentarios. Ayude a todos a sentirse vistos, escuchados y valorados."]},{"id":"s043","nivel":2,"titulo":"Opciones de juegos","fuente":{"pagina_impresa_inicio":33,"pagina_impresa_fin":35,"pagina_pdf_inicio":37,"pagina_pdf_fin":39},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Carrera de orugas Forme equipos con la misma cantidad de participantes, con cinco, siete o nueve jugadores en cada equipo (dependiendo del tamaño de su compañía). Forme los equipos en filas paralelas detrás de una línea de salida. Indique a los jóvenes que coloquen las manos sobre los hombros del miembro del equipo que está delante de ellos para formar una “oruga”. Luego, los equipos corren hasta una línea de meta de acuerdo con las siguientes reglas de movimiento: la primera persona de la fila salta hacia adelante una vez; luego salta la siguiente persona; esto continúa en la fila hasta que la última persona de la fila salta hacia adelante. Luego de que la última persona salte, él o ella debe gritar el nombre de la compañía. Entonces el equipo completo puede avanzar saltando una vez, todos al mismo tiempo. Repita el proceso para que la oruga avance. Los jóvenes deben mantener las manos en los hombros del miembro del equipo que tienen delante durante toda la carrera. Los jugadores solo pueden avanzar saltando hacia adelante una vez con ambos pies. Si un equipo rompe alguna de las reglas de movimiento, deben regresar a la línea de inicio y empezar otra vez. Sonidos de animales Calcule con anticipación cuántos grupos se formarían al dividir su compañía en grupos pequeños de tres a cuatro participantes cada uno. A continuación, piense en varios animales, los suficientes como para que haya un animal por cada grupo pequeño. (Los animales pueden incluir lobo, gato, cerdo, serpiente, león, cuervo, mono, rana, elefante, etc. No dude en ser creativo). Haga todo esto en privado antes de que comience el juego.","Para comenzar el juego, invite a los participantes a cerrar los ojos y dar vueltas mientras un consejero se mueve entre ellos, susurrando el nombre de uno de los animales a cada persona. Luego, los participantes emiten el sonido del animal asignado y caminan, escuchando a otros que hacen el mismo sonido.","El desafío consiste en encontrar a todos los demás animales de la misma especie que la suya y gana el primer grupo que termina. Nadie puede hablar; los participantes solo pueden hacer los sonidos de los animales. En breve es probable que se genere un ruidoso caos y surja la unión a medida que los animales se hallan unos a otros. Prepárese para guiar a las personas lejos de las áreas peligrosas si es necesario. Marcadores de curitas Seleccione de cinco a diez participantes para que sean marcadores y otros cinco para que sean médicos; el resto de los jugadores son pacientes. Un equipo está formado por los marcadores, y el segundo equipo está formado por los médicos y los pacientes juntos.","Los marcadores comienzan a perseguir y “marcar” (tocando suavemente) a tantos pacientes y médicos como sea posible. Cuando un participante es marcado, debe “colocar una curita” sosteniéndose la mano directamente en el lugar donde fue marcado. Cada participante tiene dos curitas (las dos manos). Una vez que se les marca por tercera vez, deben quedar congelados y sentarse hasta que un médico los “cure” tocándolos.","Los médicos no pueden curarse a sí mismos, pero pueden curar a otros, aunque el médico tenga dos curitas puestas. Los médicos solo pueden curar a los jugadores congelados que están sentados. Después de que pasen tres o cinco minutos, detenga el juego y cuente a todos los pacientes y médicos. Por cada jugador que esté congelado o tenga dos vendajes, los marcadores obtienen un punto; por cada jugador que tenga cero o un vendaje, el equipo de médicos y pacientes obtiene un punto. Gana el equipo que haya obtenido más puntos. Si los marcadores han congelado a todos, elija nuevos marcadores y comience una nueva ronda.","También se puede jugar una versión con todos los jugadores como marcadores (gana la última persona que quede en pie) o cambiar la dinámica del juego variando el número de marcadores y médicos.","El tronco envenenado Todos los participantes se paran formando un círculo y se agarran de los antebrazos de las personas a su izquierda y derecha. Elija a un participante para que sea el “tronco envenenado” y pídale que se quede inmóvil en el centro del círculo. Luego, los participantes intentan “envenenar” a otros jugadores tirando del otro lado del círculo hacia el “tronco” en el medio. Si alguno de los participantes del círculo toca el tronco, queda envenenado y debe abandonar el círculo. El círculo se irá reduciendo poco a poco, y los últimos cuatro o cinco jugadores no envenenados son los ganadores. Si los jugadores del círculo dejan de entrelazar los brazos, vuelvan a formar el círculo y comiencen otra vez."]},{"id":"s044","nivel":1,"titulo":"Establecimiento de metas en la noche de hogar","fuente":{"pagina_impresa_inicio":35,"pagina_impresa_fin":35,"pagina_pdf_inicio":39,"pagina_pdf_fin":39},"tipo_contenido":"texto_extraido_del_manual","parrafos":["El establecimiento de metas unifica a una compañía proporcionando motivación y dirección para ayudar a cada joven a tomar decisiones sabias durante la sesión de FSY. Haga un seguimiento diario de las metas personales y de la compañía, alentando y elogiando a los participantes a medida que progresan. En el Día 5, durante el repaso del establecimiento de metas, revisará el progreso de los jóvenes y los alentará a fijarse metas para llevarse sus experiencias de FSY a casa."]},{"id":"s045","nivel":2,"titulo":"Objetivos","fuente":{"pagina_impresa_inicio":35,"pagina_impresa_fin":35,"pagina_pdf_inicio":39,"pagina_pdf_fin":39},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Ayude a los jóvenes a reconocer que las decisiones que toman cada día los ayudan a permanecer en la senda de los convenios hacia la vida eterna.","• Fije metas para fomentar la unidad, el servicio y el crecimiento espiritual durante la semana."]},{"id":"s046","nivel":2,"titulo":"Preparación","fuente":{"pagina_impresa_inicio":35,"pagina_impresa_fin":36,"pagina_pdf_inicio":39,"pagina_pdf_fin":40},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Con espíritu de oración, prepárese y analice con su consejero adjunto cómo facilitar esta actividad. Usted simplemente guiará el análisis; los jóvenes determinarán las metas de la compañía.","• Estudie los siguientes recursos y prepárese espiritualmente para enseñar con eficacia.","◦ Jeffrey R. Holland, “Sed, pues, vosotros perfectos… con el tiempo”, Liahona , noviembre de 2017","◦ M. Russell Ballard, “Volver y recibir”, Liahona , mayo de 2017","◦ Dieter F. Uchtdorf, “¡Pueden hacerlo ahora!”, Liahona , noviembre de 2013.","◦ Dieter F. Uchtdorf, “El ser genuinos”, Liahona , mayo de 2015 SEGMENTO DURACIÓN Introducción al establecimiento de metas 20:00–20:10 h Establecimiento de metas de la compañía 20:10–20:25 h Establecimiento de metas individuales 20:25–20:40 h Conclusión 20:40–20:45 h"]},{"id":"s047","nivel":2,"titulo":"Introducción al establecimiento de metas (10 minutos)","fuente":{"pagina_impresa_inicio":36,"pagina_impresa_fin":36,"pagina_pdf_inicio":40,"pagina_pdf_fin":40},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Enseñe a los jóvenes cómo registrar metas personales y de la compañía en su Manual para el participante. Anímelos a anotar las impresiones que reciban durante la semana. Utilice “Un modelo para el crecimiento” como bosquejo para el análisis. Un modelo para el crecimiento","• Descubre tus necesidades, dones y talentos, y cómo puedes mejorar y crecer.","• Planifica para mejorar, incluyendo las acciones que puedes llevar a cabo para hacerlo.","• Actúa para aumentar tu fe, siguiendo tu plan.","• Reflexiona sobre lo que has aprendido y sentido.","• Celebra lo que has logrado. ¿De qué manera los pasos de descubrir, planificar, actuar, reflexionar y celebrar te ayudaron con tu meta? Junto a cada línea de las páginas 16–17 del Manual para el participante, escribe cómo llevaste a cabo esas acciones en relación con tu meta."]},{"id":"s048","nivel":2,"titulo":"Establecimiento de metas de la compañía (15 minutos)","fuente":{"pagina_impresa_inicio":37,"pagina_impresa_fin":37,"pagina_pdf_inicio":41,"pagina_pdf_fin":41},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Ayude a los jóvenes a aportar ideas, analizar y fijar metas relacionadas utilizando el modelo de descubrir , planificar y actuar . Fije metas que unan e inspiren a su compañía. Podría dividir la compañía en grupos pequeños para que cada persona piense en una idea antes de reunirse para decidir las metas de la compañía, brindándoles ayuda según sea necesario. Utilice esta actividad para dar un ejemplo a los jóvenes en cuanto a fijar sus metas personales.","• Recuerde a los jóvenes la importancia de fijar metas rectas que tendrán un efecto positivo en su vida.","• Anote las metas que su compañía se fije para que pueda recordárselas a lo largo de la sesión."]},{"id":"s049","nivel":2,"titulo":"Establecimiento de metas individuales (15 minutos)","fuente":{"pagina_impresa_inicio":37,"pagina_impresa_fin":37,"pagina_pdf_inicio":41,"pagina_pdf_fin":41},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Los jóvenes seguirán el modelo que utilizaron al fijar las metas de la compañía para fijar sus propias metas individuales para la semana, de acuerdo con el plan que su Padre Celestial tiene para ellos.","• Anímelos a orar para recibir guía e inspiración antes de comenzar, ya que el fijar metas puede ser una experiencia sagrada cuando hacemos partícipe al Salvador.","• Invite a los jóvenes a que se dispersen y dediquen tiempo a fijar sus metas individuales sin molestar a los demás participantes."]},{"id":"s050","nivel":2,"titulo":"Conclusión (5 minutos)","fuente":{"pagina_impresa_inicio":37,"pagina_impresa_fin":37,"pagina_pdf_inicio":41,"pagina_pdf_fin":41},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Vuelva a reunir a su compañía y pida a varios voluntarios, sin presionarlos, que compartan una meta personal.","• Si se siente inspirado, podría compartir la siguiente cita para alentar a aquellos que puedan estar preocupados por no alcanzar sus metas: “Incluso aquellos que ponen su corazón en metas divinas, tal vez tropiecen de vez en cuando, pero no serán derrotados. Ellos confían en las promesas de Dios y cuentan con ellas. Se volverán a levantar con una radiante esperanza en un Dios justo y la visión inspirada de un gran futuro. Saben que pueden hacerlo ahora”.","Dieter F. Uchtdorf, “¡Pueden hacerlo ahora!”, Liahona , noviembre de 2013, pág. 57"]},{"id":"s051","nivel":1,"titulo":"Recuento nocturno de personas","fuente":{"pagina_impresa_inicio":37,"pagina_impresa_fin":38,"pagina_pdf_inicio":41,"pagina_pdf_fin":42},"tipo_contenido":"texto_extraido_del_manual","parrafos":["En cuanto regresen a los dormitorios por la noche, asegúrese de que todos los jóvenes hayan sido contados y luego informe de ello a su coordinador auxiliar. Recuérdeles a los jóvenes que deben:","• Prepararse para acostarse antes de la sesión de Reflexiona y repasa todas las noches.","• Preparar el devocional matutino para los participantes, si se les asigna.","• Cerrar todas las persianas o asegurarse de que las ventanas estén cubiertas para que las personas no puedan ver el interior de la habitación (si corresponde).","• No abandonar el dormitorio después del recuento de personas."]},{"id":"s052","nivel":1,"titulo":"Tiempo para meditar","fuente":{"pagina_impresa_inicio":38,"pagina_impresa_fin":38,"pagina_pdf_inicio":42,"pagina_pdf_fin":42},"tipo_contenido":"texto_extraido_del_manual","parrafos":["• Permita que los jóvenes se relajen y conversen mientras se preparan para acostarse (incluso ducharse, cepillarse los dientes u otras necesidades relacionadas con la higiene). Desaliente el comportamiento revoltoso.","• Tenga paciencia con los retrasos inesperados y dé a los participantes el tiempo suficiente para prepararse para ir a dormir.","• Aliente a los jóvenes a prepararse para los devocionales para los participantes durante el tiempo para meditar.","• No se vaya a su dormitorio durante ese tiempo. En vez de ello, permanezca en un lugar donde pueda supervisar las habitaciones de los participantes y asegurarse de que no salgan de sus dormitorios. No utilice este tiempo para ducharse, hacer llamadas telefónicas, etc."]},{"id":"s053","nivel":1,"titulo":"Reflexiona y repasa","fuente":{"pagina_impresa_inicio":38,"pagina_impresa_fin":39,"pagina_pdf_inicio":42,"pagina_pdf_fin":43},"tipo_contenido":"texto_extraido_del_manual","parrafos":["Los consejeros deben permanecer con su atuendo de la conferencia FSY durante Reflexiona y repasa.","Reflexiona y repasa es un momento cada noche para que los jóvenes mediten y procesen la información y las experiencias de su día y, en última instancia, para que reconozcan lo que el Padre Celestial está tratando de enseñarles individualmente. Para ayudarlos a interiorizar lo que han aprendido, se los invita a anotar sus pensamientos y a compartir sus experiencias y testimonios los unos con los otros. Esto ayuda a consolidar lo que han aprendido y los prepara para recibir más revelación. Una actividad de Reflexiona y repasa eficaz requiere la guía del Espíritu Santo, quien lleva la verdad al corazón de los jóvenes y los inspira a cambiar. Su responsabilidad principal es crear un ambiente en el que el Espíritu pueda tener la máxima influencia. Estudie los siguientes pasajes de las Escrituras a medida que se esfuerza por estar preparado y ser guiado por el Espíritu Santo durante la actividad Reflexiona y repasa nocturna.","• Doctrina y Convenios 84:85","• Doctrina y Convenios 100:5–6","• 2 Nefi 33:1 En 3 Nefi 17:2–3, Cristo enseña principios rectores que pueden conducir a una actividad Reflexiona y repasa exitosa. Aliente a los jóvenes a estudiar esos versículos con espíritu de oración para descubrir doctrina y principios relacionados con reflexionar sobre las cosas que han aprendido. Invítelos a comprender esos principios más profundamente y a estar preparados para aprender más mañana."]},{"id":"s054","nivel":2,"titulo":"Formato de Reflexiona y repasa","fuente":{"pagina_impresa_inicio":39,"pagina_impresa_fin":40,"pagina_pdf_inicio":43,"pagina_pdf_fin":44},"tipo_contenido":"texto_extraido_del_manual","parrafos":["La preparación para Reflexiona y repasa comienza cada mañana recordando a los jóvenes que busquen y anoten ideas para compartir esa noche, comenzando con el devocional matutino para los participantes sobre Para la Fortaleza de la Juventud: Una guía para tomar decisiones . Anímelos a tomar notas en su manual.","Reflexiona y repasa se basará en lo que los jóvenes quieran hablar ese día, pero si ellos muestran interés en un tema específico, podría pedirles que reflexionen sobre cierta pregunta o aspecto de ese tema a lo largo del día, e invitarlos a estar listos para analizarlo esa noche.","Aunque los jóvenes generan una gran parte del contenido de cada actividad Reflexiona y repasa, usted debe orar, meditar y prepararse a lo largo del día para estar listo para dirigir el análisis de acuerdo con el Espíritu y las necesidades de los participantes. Es recomendable que se familiarice con Para la Fortaleza de la Juventud: Una guía para tomar decisiones (que se encuentra al final de este manual) y con cualquier otro tema que los jóvenes hayan estudiado ese día, a fin de ayudarlos a relacionar su análisis con las cosas que han aprendido.","Reflexionar (5 minutos) Es mejor comenzar cada Reflexiona y repasa con un momento tranquilo de reflexión mientras los jóvenes escriben sus impresiones del día en la página del manual dedicada a este propósito. Esa es la parte de “reflexiona” de Reflexiona y repasa. Los consejeros deben esforzarse por crear un ambiente de reverencia en ese momento, haciendo cosas como poner música reverente, pedir silencio y atención a los jóvenes distraídos o ruidosos, etc.","Repaso (15 minutos) Durante “repasa”, los jóvenes podrían presentar lo que hayan escrito. Usted es responsable de hacer preguntas de seguimiento que los ayuden a profundizar y a hacer participar al resto del grupo en el análisis. Los jóvenes pasarán gran parte del día escuchando y sintiendo verdades importantes. Permitirles expresar verbalmente sus sentimientos los unos a los otros puede afianzar poderosamente lo que han aprendido y prepararlos para ponerlo en práctica en casa.","A veces, los jóvenes estarán tan preparados para Reflexiona y repasa que hablarán de forma natural de sus sentimientos sin mucha ayuda del consejero. Fomente eso si se mantienen centrados en la tarea y el análisis es inspirador. El éxito de Reflexiona y repasa depende de preguntas de seguimiento que ayuden a los jóvenes a entender y poner en práctica los principios que se están analizando.","Llévatelo a casa (5 minutos) Después de que los jóvenes hayan compartido sus pensamientos unos con otros, Reflexiona y repasa termina con la invitación del consejero a anotar acciones específicas que pueden realizar tanto en la conferencia FSY como en casa para poner en práctica lo que han aprendido ese día. No omita esta parte. En el manual se ha incluido una página separada de Reflexiona y repasa para cada noche titulada “Llévatelo a casa: Una invitación a actuar”. A lo largo de Reflexiona y rep
